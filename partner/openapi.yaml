  /signing-links/{token}:
    get:
      tags:
        - Requirements
      operationId: getSigningLinkContext
      summary: Read a signing link
      security: []
      description: What the hosted signing page renders - the ask, the partner's branding and the embedded signing session. Authenticated by the token itself, no API key. The signature itself completes inside the embedded session. The requirement resolves once the signature completes, and the page only ever reads.
      parameters:
        - $ref: '#/components/parameters/RequirementToken'
      responses:
        '200':
          description: The context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningContext'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        href: /api-reference/get-signing-link-context
  /requirement-links/{token}:
    get:
      tags:
        - Requirements
      operationId: getRequirementLinkContext
      summary: Read a hosted link's context
      security: []
      description: 'What the hosted page renders: what is asked and of whom, plus your hosted-page branding. Authenticated by the token itself - no API key.'
      parameters:
        - $ref: '#/components/parameters/RequirementToken'
      responses:
        '200':
          description: The context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementContext'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        href: /api-reference/get-requirement-link-context
  /requirement-links/{token}/document:
    put:
      tags:
        - Requirements
      operationId: putRequirementLinkDocument
      summary: Upload the document set through a hosted link
      security: []
      description: |-
        The hosted page's upload: the link URL itself is the credential - a time-limited, single-purpose capability, no API key. Send the COMPLETE document set in one request: `multipart/form-data` with one part per page (a two-sided ID is two parts), or the raw bytes of a single file with its Content-Type. The request itself is completeness - there is no add-another-page call.
        Validation: PDF, JPEG and PNG only, at most 10 MB per file, at most 2 files, and the bytes must actually be the format the Content-Type declares (file signatures are checked) - a mislabeled file is refused with `invalid_request`.
      parameters:
        - $ref: '#/components/parameters/RequirementToken'
        - name: filename
          in: query
          required: false
          description: The filename, when the body is raw bytes rather than multipart.
          schema:
            type: string
            maxLength: 256
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
          application/pdf:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The context afterwards - resolved when the set completes the ask.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        href: /api-reference/put-requirement-link-document
webhooks:
  company.created:
    post:
      tags:
        - Webhooks
      operationId: onCompanyCreated
      summary: A company was created
      description: 'Sent to your configured endpoint when a company is created through the API, in either mode (a `clmt_test_` key''s events carry `livemode: false`). The request body is the `event` resource. Fetch the company it names for its current state. Verify the `Clemta-Webhook-Signature` header with your endpoint''s signing secret before trusting the payload, and respond with any 2xx to acknowledge - a non-2xx or a timeout is retried with backoff.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/company-created
  company.status.changed:
    post:
      tags:
        - Webhooks
      operationId: onCompanyStatusChanged
      summary: A company's formation status changed
      description: Sent when a company moves between formation states. The request body is the `event` resource. Branch on the company's status after fetching it rather than on the event type alone. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge - a non-2xx or a timeout is retried with backoff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/company-status-changed
  company.verified:
    post:
      tags:
        - Webhooks
      operationId: onCompanyVerified
      summary: A company's owners cleared verification
      description: Sent once, when the last owner's identity document lands and the company is ready for formation - well before incorporation (which has its own event, `company.incorporated`). Verification never regresses. The request body is the `event` resource. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge - a non-2xx or a timeout is retried with backoff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/company-verified
  company.incorporated:
    post:
      tags:
        - Webhooks
      operationId: onCompanyIncorporated
      summary: A company was incorporated
      description: Sent once, when the state accepts the filing and the company becomes active - the milestone to tell your client about. `company.status.changed` fires as well. This event exists so the moment is a single, unmistakable signal. The request body is the `event` resource. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge - a non-2xx or a timeout is retried with backoff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/company-incorporated
  company.onboarding.completed:
    post:
      tags:
        - Webhooks
      operationId: onCompanyOnboardingCompleted
      summary: A pre-existing company is fully onboarded
      description: Sent once, when Clemta finishes taking a pre_existing company onto the platform - the moment a newly formed company would instead announce `company.incorporated`. A company incorporated years before it arrived never fires the incorporation event. This is its counterpart milestone. `data.object` is the company. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/company-onboarding-completed
  company.name.changed:
    post:
      tags:
        - Webhooks
      operationId: onCompanyNameChanged
      summary: A company's legal name changed
      description: Sent when Clemta changes the company's legal name - typically to clear a conflict with the state. The payload carries the new name. Update your own records and tell your client. The request body is the `event` resource. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge - a non-2xx or a timeout is retried with backoff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/company-name-changed
  company.ein.assigned:
    post:
      tags:
        - Webhooks
      operationId: onCompanyEinAssigned
      summary: A company received its EIN
      description: Sent once, when the IRS issues the company's federal tax id and Clemta records it. The payload carries `ein`. The request body is the `event` resource. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge - a non-2xx or a timeout is retried with backoff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/company-ein-assigned
  company.document.received:
    post:
      tags:
        - Webhooks
      operationId: onCompanyDocumentReceived
      summary: An owner's identity document was received
      description: Sent when an individual owner uploads their identity document. The request body is the `event` resource. Fetch the company it names to see which owners are still outstanding. When the last document lands, the company also emits `company.status.changed`. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge - a non-2xx or a timeout is retried with backoff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/company-document-received
  company.dissolved:
    post:
      tags:
        - Webhooks
      operationId: onCompanyDissolved
      summary: The company was dissolved
      description: Sent exactly once, when a dissolution order completes and the company reaches its terminal `dissolved` status. Every recurring service on the company stops renewing at that moment, open requirements are closed, and nothing further can be ordered to it. The request body is the `event` resource, whose `data.object` is the company as of the dissolution. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/company-dissolved
  company.updated:
    post:
      tags:
        - Webhooks
      operationId: onCompanyUpdated
      summary: A company's details changed
      description: Sent when Clemta edits the company's identity - entity type, state, industry, share structure, formation date, legal address or the owner roster. `data.object` is the company as it now stands. Verify the `Clemta-Webhook-Signature` header before trusting the payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/company-updated
  company.entitlements.changed:
    post:
      tags:
        - Webhooks
      operationId: onCompanyEntitlementsChanged
      summary: A company's remaining rights changed
      description: Sent when the company's `entitlements` move - a tax-filing credit added by an order or by Clemta, or consumed by a filing. `data.object` is the company with its current `entitlements`. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
