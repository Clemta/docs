        href: /api-reference/webhooks/tax-filing-status-changed
  service_order.status.changed:
    post:
      tags:
        - Webhooks
      operationId: onServiceOrderStatusChanged
      summary: A service order's status changed
      description: Sent when a service order is created or its fulfilment status changes, including cancellation. The request body is the `event` resource, whose `data.object` is the service order as of the change. Branch on its status rather than on the event type alone. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge - a non-2xx or a timeout is retried with backoff.
