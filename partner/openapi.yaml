    CompanyEntitlements:
      type: object
      description: Rights the company holds, as counts remaining. An order for an entitlement product adds one. A tax filing consumes one when it is submitted. Some may be granted directly. `company.entitlements.changed` announces every move.
      properties:
        federal_tax_filing:
          type: integer
          format: int64
          minimum: 0
          description: Federal tax filings the company may still open.
          example: 1
        state_tax_filing:
          type: integer
          format: int64
          minimum: 0
          description: State tax / annual compliance filings the company may still open.
          example: 0
    FieldConditional:
      type: object
      description: This field applies only while another field holds one of the listed values.
      required:
        - field
        - values
      properties:
        field:
          type: string
          description: Key of the controlling field.
        values:
          type: array
          items:
            type: string
          description: Any of these values on the controlling field switches this one on.
    FieldValidation:
      type: object
      description: Constraints an answer must satisfy beyond its type. The server enforces these. A violation answers `invalid_request` with the field named in `errors[]`.
      properties:
        pattern:
          type: string
          description: Regular expression a text answer must match.
        min_length:
          type: integer
        max_length:
          type: integer
        min:
          type: number
          description: Lower bound for a number.
        max:
          type: number
    FieldFileRule:
      type: object
      description: Constraints on a file field's upload.
      properties:
        accepted_types:
          type: array
          items:
            type: string
          description: Media types or extensions accepted (e.g. `application/pdf`, `jpg`). Absent means PDF, JPEG and PNG.
        max_size_bytes:
          type: integer
          format: int64
    ServiceFormFieldDef:
      type: object
      description: One field of a form. It carries every attribute you need to render the field in your own UI, and the server validates answers against the same definition.
      required:
        - field_name
        - field_type
      properties:
        key:
          type: string
          description: Stable field key - pass it back as the answer's `key`.
        field_name:
          type: string
          description: The field's label.
        field_type:
          type: string
          enum:
            - text
            - textarea
            - number
            - date
            - boolean
            - select
            - multi_select
            - file
            - email
            - phone
            - address
          description: What kind of answer the field takes. `select` takes one of `options`, `multi_select` a list of them, `date` an ISO date (YYYY-MM-DD), `file` a pre-uploaded file id (POST /v1/files, purpose additional_document).
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
          description: Allowed values for select / multi_select.
        guidance:
          type: string
          description: Longer explanation of what is being asked.
        help:
          type: string
          description: Short helper text under the input.
        note:
          type: string
          description: A caution shown near the field.
        placeholder:
          type: string
        info_points:
          type: array
          items:
            type: string
        conditional:
          $ref: '#/components/schemas/FieldConditional'
        validation:
          $ref: '#/components/schemas/FieldValidation'
        file:
          $ref: '#/components/schemas/FieldFileRule'
    ServiceOrderForm:
      type: object
      description: The form the order's current fulfilment step is waiting on.
      required:
        - fields
      properties:
        title:
          type: string
        warning:
          type: string
          description: A caution to show above the form.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ServiceFormFieldDef'
    ServiceOrderQuote:
      type: object
      description: The negotiated-price lifecycle on a product priced per order (for example, catch-up bookkeeping). `pending` until Clemta reviews the work and sets the amount, `quoted` while the price waits for your `accept_quote`, `accepted` once you took it and the charge landed. Nothing is billed before acceptance.
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - pending
            - quoted
            - accepted
        unit_amount:
          type: integer
          format: int64
          description: The Clemta-set wholesale price, in the currency's smallest unit. Absent while pending.
        currency:
          type: string
        quoted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Accept before this moment. A lapsed quote refuses acceptance, and Clemta re-prices on request.
        accepted_at:
          type: string
          format: date-time
    OrderFee:
      type: object
      required:
        - kind
        - unit_amount
      description: One pass-through charge riding a service order, at the amount resolved when the order was made.
      properties:
        kind:
          type: string
          description: What the line is - state_fee, processing_fee or government_fee.
          example: state_fee
        unit_amount:
          type: integer
          format: int64
          description: The amount in the currency's smallest unit.
          example: 30000
        currency:
          type: string
          example: usd
    ServiceOrder:
      type: object
      description: One product ordered on a company. Billed to you when created (or at each period end for arrears products). Reversed by a credit if cancelled before fulfilment starts. An active recurring order can be cancelled to stop renewing at the period end.
      required:
        - object
        - id
        - company
        - product_key
        - status
        - unit_amount
        - currency
        - created_at
      properties:
        object:
          type: string
          enum:
            - service_order
          description: Entity name.
        id:
          type: string
          pattern: ^so_[0-9A-Za-z]{22}$
          example: so_0346sFPEvSkJvY8vt14NNw
        company:
          type: string
          pattern: ^cmp_[0-9A-Za-z]{22}$
          description: The company this order is on.
        product_key:
          type: string
          example: ein
        interval:
          type: string
          enum:
            - one_time
            - monthly
            - yearly
          description: Billing cadence - one_time, or recurring monthly/yearly.
        status:
          type: string
          enum:
            - received
            - quote_pending
            - in_progress
            - requires_action
            - completed
            - canceled
          description: 'Fulfilment status, derived from where Clemta has the order: `received` until fulfilment starts (a cancellable state), `quote_pending` while a priced-by-quote product waits for the price and your acceptance (also cancellable - cancelling declines the quote), `in_progress` while Clemta works, `requires_action` while the current step waits on a form from you or your client (an open `form` requirement says which), `completed` once the final step is reached - terminal, `completed_at` is set and `service_order.completed` fires once - and `canceled`.'
        options:
          type: object
          additionalProperties:
            type: string
          description: The variant choices this order was placed with (option key -> value).
          example:
            llc_members: multi_member
        form_required:
          type: boolean
          description: True when fulfilment needs a form from the client (e.g. an ITIN or BOI service). Known once the order reaches fulfilment.
        workflow_status:
          type: string
          description: The live fulfilment step (e.g. "Application In Progress", "Signature Request"). Present once the order is being fulfilled.
        form:
          allOf:
            - $ref: '#/components/schemas/ServiceOrderForm'
          description: The form the current step is waiting on, when `form_required` is true - the fields to submit next via the form endpoint. Present on the single-order view.
        unit_amount:
          type: integer
          format: int64
          description: The wholesale price you were billed, in the currency's smallest unit (cents).
          example: 7900
        currency:
          type: string
          example: usd
        created_at:
          type: string
          format: date-time
        quote:
          $ref: '#/components/schemas/ServiceOrderQuote'
        shareholder:
          type: string
          description: The company owner this order is for (products ordered per owner, e.g. an ITIN).
        outcome:
          type: string
          description: How a completed order ended, where completion alone does not say - a bank application's approved or declined, a good-standing check's not eligible. Recorded by Clemta. A decline is a delivered service, not a credit. Absent while the work runs and on orders whose completion is the whole answer.
        included_in:
          type: string
          description: Present when this order was attached by a bundle order (the formation's included services) - it names the bundle product. Included orders bill nothing of their own. A paid option choice bills only the difference.
        fees:
          type: array
          items:
            $ref: '#/components/schemas/OrderFee'
          description: Pass-through lines this order carried beside `unit_amount` - the state's own charge and the processing fee, frozen at their order-time amounts. Each appears as its own line on your statement.
        next_renewal_at:
          type: string
          format: date-time
          description: When the next period bills (for a product billed in arrears, the end of the running period). Only on recurring orders. Absent once renewals end.
        renewal_cancel_requested_at:
          type: string
          format: date-time
          description: When you requested cancellation. The request awaits a Clemta decision - renewals keep billing until it is approved. You hear the outcome as `service_order.renewal_canceled` or `service_order.renewal_cancel_denied`.
        renewal_canceled_at:
          type: string
          format: date-time
          description: When the cancellation was approved. The order stops billing at `renewal_ends_at`. Fulfilment status is unaffected.
        renewal_ends_at:
          type: string
          format: date-time
          description: The period end the service runs to after a renewal cancel. An arrears product still bills this period at that moment, then stops.
        canceled_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          description: When the order first reached `completed`. `service_order.completed` announces this moment, and it does not change afterward.
    RequirementSigner:
      type: object
      description: One party on a signature requirement. A document may need several signatures. Each signer gets their own hosted signing session and signs independently, and the requirement resolves only once the last of them completes.
      required:
        - ref
        - status
      properties:
        ref:
          type: string
          pattern: ^sgr_[0-9A-Za-z]{22}$
          description: The signer's stable handle. Supply a deferred (name-only) signer's email by this ref on POST /v1/companies/{id}/signature-signers.
        email:
          type: string
          description: The signer's email. Absent while status is `pending_email` - a name-only signer whose email you still owe.
        name:
          type: string
          description: The signer's display name.
        status:
          type: string
          enum:
            - pending_email
            - pending
            - viewed
            - signed
            - declined
          description: 'Where this signer is: `pending_email` (no email yet - supply it), `pending` (email set, not opened), `viewed` (opened or started), `signed` (completed their part), `declined` (refused - which cancels the whole requirement).'
        viewed_at:
          type: string
          format: date-time
          description: When this signer first opened the document.
        started_at:
          type: string
          format: date-time
          description: When this signer began filling the document.
        signed_at:
          type: string
          format: date-time
          description: When this signer completed their part.
        declined_at:
          type: string
          format: date-time
          description: When this signer declined.
    ServiceFormField:
      type: object
      description: One answer to a service order's current form step.
      required:
        - value
      properties:
        key:
          type: string
          description: The field key from the form schema, when it has one.
        field_name:
          type: string
          description: The field's label from the form schema.
        value:
          description: The answer - a string, number, or boolean. A file field's value is a pre-uploaded file id (POST /v1/files, purpose additional_document).
    RequirementAttachment:
      type: object
      description: One file-field upload collected on a form requirement.
      required:
        - filename
      properties:
        field:
          type: string
          description: The form field key this file answers.
        field_name:
          type: string
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
    Requirement:
      type: object
      description: 'One thing needed from you or your client: an owner''s identity document, a service-order form, or something Clemta asked for (a company-name change, extra information). Fulfill it over the API, or mint a hosted link and hand fulfillment to your client.'
      required:
        - object
        - id
        - company
        - type
        - status
        - requested_by
        - livemode
        - created_at
      properties:
        object:
          type: string
          enum:
            - requirement
          description: Entity name.
        id:
          type: string
          pattern: ^rqmt_[0-9A-Za-z]{22}$
          example: rqmt_0346sFPEvSkJvY8vt14NNw
        company:
          type: string
          pattern: ^cmp_[0-9A-Za-z]{22}$
          description: The company this requirement is on.
        service_order:
          type: string
          pattern: ^so_[0-9A-Za-z]{22}$
          description: The service order this requirement belongs to - a form requirement's own order, or the order a Clemta-opened information or document ask was scoped to.
        shareholder:
          type: string
          pattern: ^sh_[0-9A-Za-z]{22}$
          description: The owner a document requirement is about.
        purpose:
          type: string
          enum:
            - identity_document
            - formation_document
            - additional_document
          description: 'On a `document` requirement: the file-policy purpose it collects under, which decides the accepted size, content types, page count and link lifetime (see the file upload guide''s policy table).'
        type:
          type: string
          enum:
            - document
            - form
            - name_change
            - information
            - signature
          description: What fulfills it. `document` - an identity document file. `form` - the current fulfilment step's answers. `name_change` - a new company name (a `name` value). `information` - free-form answers.
        status:
          type: string
          enum:
            - open
            - resolved
            - canceled
        requested_by:
          type: string
          enum:
            - system
            - operations
          description: Who opened it - the platform itself, or Clemta.
        document_name:
          type: string
          description: For a signature requirement - the name of the document awaiting signature.
        signers:
          type: array
          items:
            $ref: '#/components/schemas/RequirementSigner'
          description: For a signature requirement - every party that must sign, with each one's progress. The requirement resolves only when they have all signed.
        message:
          type: string
          description: Why it was opened, in words you can show your client.
        cancel_reason:
          type: string
          description: 'On a canceled requirement - why it closed without being fulfilled: a signer''s decline reason, or Clemta withdrawing the ask. Safe to show your client.'
        form:
          $ref: '#/components/schemas/ServiceOrderForm'
          description: 'For an OPEN `form` requirement: the fields to collect, read live from the fulfilment workflow.'
        response:
          type: array
          items:
            $ref: '#/components/schemas/ServiceFormField'
          description: What fulfilled it (absent for documents).
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/RequirementAttachment'
          description: A form requirement's file-field uploads collected so far. Forwarded together with the values when the form is fulfilled.
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
    Relationship:
      type: object
      additionalProperties: false
      description: The owner's relationship to the company - role, stake, and standing.
      properties:
        title:
          type: string
          enum:
            - sole_owner
            - ceo
            - coo
            - cfo
            - cto
            - cmo
            - cio
            - hr_director
            - sales_director
            - product_manager
            - project_manager
            - software_engineer
            - data_analyst
            - ux_designer
            - ui_designer
            - operations_manager
            - other
          description: The owner's role, as an API token - the platform's position list. Use `other` with `custom_title` for any role outside it.
        custom_title:
          type: string
          maxLength: 120
          pattern: ^[A-Za-z0-9 &.,:;'#-]+$
          description: The custom role name. Required when `title` is `other`, rejected otherwise.
        percent_ownership:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          description: Must be above 0 for an individual or company owner.
        representative:
          type: boolean
          description: The primary owner authorized to act for the company. Exactly one owner must be.
        director:
          type: boolean
    Document:
      type: object
      required:
        - status
      description: The state of an owner's identity document.
      properties:
        status:
          type: string
          enum:
            - required
            - received
            - not_required
          description: not_required for a company owner. required until the individual uploads it, then received.
    Shareholder:
      type: object
      required:
        - object
        - id
        - type
        - relationship
        - document
      description: A company owner.
      properties:
        object:
          type: string
          enum:
            - shareholder
        id:
          type: string
          pattern: ^sh_[0-9A-Za-z]{22}$
        type:
          type: string
          enum:
            - individual
            - company
            - option_pool
        first_name:
          type: string
        last_name:
          type: string
        name:
          type: string
        representative_name:
          type: string
          maxLength: 255
          description: The natural person acting for a company owner. Required for a company owner.
        email:
          type: string
        phone:
          type: string
        phone_country:
          type: string
          description: The phone's ISO 3166 alpha-2 country code.
        tax_id_type:
          type: string
          enum:
            - ssn
            - itin
            - ein
        relationship:
          $ref: '#/components/schemas/Relationship'
        document:
          $ref: '#/components/schemas/Document'
        address:
          $ref: '#/components/schemas/Address'
    OfficerRole:
      type: string
      enum:
        - member
        - managing_member
        - manager
        - director
        - president
        - ceo
        - secretary
        - treasurer
        - cfo
        - vice_president
      description: A position on the company's management roster. The catalogue is fixed per entity type. An LLC holds `member`, `managing_member` or `manager`. A C-Corp holds `director`, `president`, `ceo`, `secretary`, `treasurer`, `cfo` or `vice_president`. A director is simply an officer holding the `director` role.
    CompanyOfficer:
      type: object
      description: 'One row of the company''s management roster: a person and the positions they hold. A director is an officer holding the `director` role - there is no separate directors list. An officer who is also an owner carries the `shareholder` id of the owner they are. A non-owner officer (a hired director or officer who holds no shares) carries none.'
      required:
        - object
        - id
        - roles
      properties:
        object:
          type: string
          enum:
            - officer
          description: Entity name.
        id:
          type: string
          pattern: ^off_[0-9A-Za-z]{22}$
          example: off_0346sFPEvSkJvY8vt14NNw
        shareholder:
          type: string
          pattern: ^sh_[0-9A-Za-z]{22}$
          description: The owner this officer is, when they hold shares. Absent for a non-owner officer.
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        title:
          type: string
          description: A free-text position label Clemta may keep alongside the roles.
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OfficerRole'
          description: The positions this person holds, entity-gated.
        source:
          type: string
          enum:
            - onboarding
            - ops
          description: Who put the row on the roster - the customer's onboarding or Clemta.
        address:
          $ref: '#/components/schemas/Address'
    Company:
      type: object
      required:
        - object
        - id
        - account_id
        - livemode
        - name
        - state
        - entity_type
        - status
        - verification
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - company
          description: Entity name. Identifies this object when it arrives without its URL - nested under an `expand[]`, inside an event payload, or in a webhook.
        id:
          type: string
          pattern: ^cmp_[0-9A-Za-z]{22}$
          description: Identifier of the company.
          example: cmp_0346sFPEvSkJvY8vt14NNw
        external_id:
          type: string
          description: Your own identifier for this company, unique across your companies.
        account_id:
          type: string
          pattern: ^acct_[0-9A-Za-z]{22}$
          description: The account (the incorporator) this company was created under. Expand `account` to embed the full object.
          example: acct_0346sFPEvSkJvY8vt14NNw
        account:
          allOf:
            - $ref: '#/components/schemas/Account'
          description: The full account this company was created under. Present only when requested with `expand[]=account`.
        livemode:
          type: boolean
          description: False for a company created with a test key. A test company is a sandbox simulation - it never reaches fulfillment or billing.
        name:
          type: string
          description: Legal name of the company.
        state:
          $ref: '#/components/schemas/StateCode'
        entity_type:
          type: string
          enum:
            - llc
            - c_corp
          description: Entity type being formed.
          example: llc
        ending:
          type: string
        industry:
          type: string
        industry_description:
          type: string
          description: Free-text description of the business, present when industry is `other`.
        custom_industry:
          type: string
          description: Short name of the custom industry, present when industry is `other`.
        timezone:
          type: string
          description: The company's IANA time zone.
        name_style:
          type: string
          enum:
            - plain
            - comma
          description: How the legal name renders around the ending.
        legal_name:
          type: string
          readOnly: true
          description: The rendered legal name - `name`, the `name_style` separator, and the `ending` ("Acme, LLC").
        owner_privacy:
          type: string
          enum:
            - public
            - private
          description: Whether the owners are kept off the public filing. Choosable only in DE, NV, WY, NM.
        pre_existing:
          type: boolean
          description: True when the company already existed before it was brought to Clemta. False when Clemta forms it.
        status:
          type: string
          enum:
            - requires_information
            - in_progress
            - active
            - cancelled
            - dissolved
          description: Lifecycle status. A company starts in requires_information while it waits for its owners' identity documents. It moves to in_progress once every required document is present and it is submitted for formation, and to active once fulfilled.
        ein:
          type: string
          description: The federal tax id, once the IRS has issued it. Fires `company.ein.assigned` when it lands.
        verified_at:
          type: string
          format: date-time
          description: When every owner's identity document was in and the company was ready for formation. `company.verified` announces this moment, and it does not change afterward.
        dissolved_at:
          type: string
          format: date-time
          description: 'When the company was dissolved. Terminal: the company''s status is `dissolved` from that moment, every recurring service stopped renewing, open requirements were closed, and nothing further can be ordered. `company.dissolved` announces this moment, and it does not change afterward.'
        incorporated_at:
          type: string
          format: date-time
          description: When the company was marked incorporated in Clemta - the moment `company.incorporated` fires. It can differ from `incorporation_date`, the legal formation date the state assigned.
        ein_assigned_at:
          type: string
          format: date-time
          description: When the EIN was assigned. `company.ein.assigned` announces this moment, and it does not change afterward.
        stage:
          type: string
          enum:
            - preparing_documents
            - documents_generated
            - signature_requested
            - submitted_to_state
            - name_conflict
            - incorporated
            - closed
          description: The fine-grained formation step under `status` - where formation stands right now. Changes fire `company.status.changed`. Reaching `incorporated` also fires `company.incorporated`.
        incorporation_date:
          type: string
          description: The legal formation date the state assigned, recorded from the formation document (for a `pre_existing` company, the one uploaded through its requirement). It can differ from `incorporated_at`, which is when Clemta marked the company incorporated. Never an input. `company.updated` announces changes.
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: The company's legal address, maintained by Clemta.
        foreign_qualifications:
          type: array
          items:
            $ref: '#/components/schemas/ForeignQualification'
          description: States the company is registered in beside its formation state.
        entitlements:
          $ref: '#/components/schemas/CompanyEntitlements'
        open_requirements:
          type: integer
          format: int64
          readOnly: true
          description: How many requirements currently stand open on this company - "is anything waiting on you" in one number, without touching `status`. Derived at read time on API responses. Webhook `data.object` snapshots omit it.
        service_orders:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/ServiceOrder'
          description: Every service order on the company, newest first, embedded when the request carries `expand[]=service_orders` - including the mandatory products a create attached automatically. The same rows `GET /companies/{id}/service-orders` lists.
        requirements:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/Requirement'
          description: The open requirements themselves, embedded when the request carries `expand[]=requirements` - the list behind `open_requirements`. Resolved history stays on `GET /companies/{id}/requirements`.
        verification:
          type: string
          enum:
            - pending
            - verified
          description: Whether the company's owners have submitted the identity documents needed to file. `verified_at` records when. State filings wait for it.
        created_at:
          type: string
          format: date-time
          description: When the company was created.
        updated_at:
          type: string
          format: date-time
          description: When the company was last modified. Also written to the `Last-Modified` response header on a single-company fetch, so a conditional `If-Modified-Since` request can be answered `304 Not Modified`.
        shareholders:
          type: array
          items:
            $ref: '#/components/schemas/Shareholder'
          description: The company's owners. Collect a missing identity document by attaching an uploaded file (`passport`) or by creating a verification session for the owner.
        officers:
          type: array
          items:
            $ref: '#/components/schemas/CompanyOfficer'
          description: The management roster - everyone who holds a position. A director is an officer holding the `director` role. There is no separate directors list. Includes officers who are not owners. Set at company creation, and kept current as the roster changes.
        management_type:
          type: string
          enum:
            - member_managed
            - manager_managed
          description: LLC only - whether the company is member-managed or manager-managed.
        officers_settled:
          type: boolean
          description: Whether the officer roster is final. When true with an empty `officers`, the company has no officers by design, not a roster still being collected.
        metadata:
          type: object
          maxProperties: 50
          additionalProperties: true
          description: Your own key-value pairs, stored and returned verbatim. Clemta never reads them.
    CompanyList:
      type: object
      required:
        - object
        - page
        - items
      properties:
        object:
          type: string
          enum:
            - list
          description: Entity name.
        page:
          $ref: '#/components/schemas/Page'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Company'
    CreateShareholderBody:
      type: object
      required:
        - type
        - relationship
      additionalProperties: false
      description: A company owner. An individual needs first_name, last_name and a tax_id with tax_id_type ssn or itin. A company needs name and a tax_id with tax_id_type ein. Identity documents are never sent here - each individual owner uploads theirs through the upload link returned on the company.
      properties:
        type:
          type: string
          enum:
            - individual
            - company
            - option_pool
        first_name:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z ]+$
          description: Required for an individual. English letters and spaces only.
        last_name:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z ]+$
          description: Required for an individual. English letters and spaces only.
        name:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9 &.,-]+$
          description: Legal name. Required for a company owner.
        representative_name:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9 &.,-]+$
          description: The natural person acting for a company owner. Required for a company owner.
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          maxLength: 32
        phone_country:
          type: string
          pattern: ^[A-Za-z]{2}$
          description: The phone's ISO 3166 alpha-2 country code, e.g. `us`. Optional.
        tax_id:
          type: string
          maxLength: 32
          description: SSN or ITIN for an individual, EIN for a company. Write-only, never returned.
        tax_id_type:
          type: string
          enum:
            - ssn
            - itin
            - ein
        relationship:
          $ref: '#/components/schemas/Relationship'
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: The owner's residential address. Required for an individual.
        passport:
          type: string
          pattern: ^file_[0-9A-Za-z]{22}$
          description: The owner's identity document as an uploaded file id (POST /v1/files, purpose `identity_document`). With it the owner arrives complete - no upload link is minted. Single-use.
    CreateOfficerBody:
      type: object
      description: A management-roster row to seat at company creation. A director is an officer holding role `director`. An officer whose `email` matches a shareholder's is seated as that owner - its identity then lives on the shareholder - so it needs no name of its own. A non-owner officer (one matching no shareholder) needs a name.
      required:
        - roles
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          description: Contact, and - when it matches a shareholder's email - the key that seats this officer as that owner.
        title:
          type: string
          description: An optional free-text position label kept alongside the roles.
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OfficerRole'
          description: The positions this person holds, entity-gated (LLC vs C-Corp catalogues).
        address:
          $ref: '#/components/schemas/Address'
    CreateCompanyBody:
      type: object
      required:
        - name
        - state
        - entity_type
      additionalProperties: false
      properties:
        external_id:
          type: string
          minLength: 1
          maxLength: 255
          description: Your own identifier for this company. Must be unique across your companies. Reusing one is rejected. Use `Idempotency-Key` to retry safely.
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9 &-]+$
          description: 'Legal name of the company to form, without the ending. IRS naming rules apply: letters, numbers, spaces, hyphen (-) and ampersand (&) only, and the name must not start with "The". The ending ("LLC", "Inc.") is the separate `ending` field. A name already registered with us in the same state is refused up front (`invalid_request`). The state registry remains the final authority - a conflict it finds later arrives as a `name_change` requirement.'
        name_style:
          type: string
          enum:
            - plain
            - comma
          default: plain
          description: 'How the legal name renders around the ending: `plain` ("Acme LLC") or `comma` ("Acme, LLC"). The rendered result is the read-only `legal_name` on the company.'
        owner_privacy:
          type: string
          enum:
            - public
            - private
          default: public
          description: Whether the owners are kept off the public filing. `private` is available only in the states that offer it - DE, NV, WY, NM - and is rejected elsewhere.
        pre_existing:
          type: boolean
          default: false
          description: 'Did the company exist before you brought it here? `false` (the default): Clemta forms it, and the formation is billed. `true`: an already-formed company you are bringing in to offer services on - no formation is billed. Products marked `required_for` the matching set (`formation` or `existing`) attach automatically.'
        state:
          $ref: '#/components/schemas/StateCode'
        entity_type:
          type: string
          enum:
            - llc
            - c_corp
          description: Entity type to form.
          example: llc
        ending:
          type: string
          enum:
            - llc
            - l_l_c
            - limited_liability_company
            - inc
            - incorporated
            - co
            - corp
            - corporation
          description: The company name suffix, as an API token. The rendered legal text is `llc` -> "LLC", `l_l_c` -> "L.L.C.", `limited_liability_company` -> "Limited Liability Company", `inc` -> "Inc.", `incorporated` -> "Incorporated", `co` -> "Co.", `corp` -> "Corp", `corporation` -> "Corporation" (see `legal_name` on the company). Must match the entity type - the first three are LLC endings, the rest C-Corp endings.
        industry:
          type: string
          enum:
            - accounting
            - advertising
            - agriculture
            - art
            - theater
            - beauty_and_cosmetic_services
            - biotech
            - business_management
            - cleaning_services
            - construction
            - consulting
            - design
            - e_commerce
            - education
            - entertainment
            - financial_services
            - fitness
            - food
            - hardware
            - health_services
            - insurance
            - investment
            - legal
            - logistics
            - marketing
            - marketplace
            - real_estate
            - recruiting
            - research
            - retail_wholesale
            - shipping_warehousing
            - support_services
            - software
            - technology
            - transportation
            - other
          description: The company's primary industry, from the platform's standard industry catalog, as API tokens. `other` requires `custom_industry` and `industry_description`.
        ein:
          type: string
          maxLength: 12
          pattern: ^[0-9]{2}-?[0-9]{7}$
          description: The company's EIN, for a `pre_existing` company that already holds one. Stored formatted `12-3456789`. `company.ein.assigned` does not fire for a value supplied here. Rejected when Clemta forms the company - the EIN is issued during formation and appears on the company once assigned (`company.ein.assigned`).
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: The company's legal address. Required for a `pre_existing` company - an existing company has one by definition. Rejected when Clemta forms the company - Clemta records the address during formation and it appears on the company then.
        foreign_qualifications:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ForeignQualification'
          description: States the company is registered in beside its formation state, for a `pre_existing` company. Each names a different state than the formation state. Rejected when Clemta forms the company.
        industry_description:
          type: string
          maxLength: 500
          description: A free-text description of the business. Required when `industry` is `other`, rejected otherwise.
        custom_industry:
          type: string
          maxLength: 120
          description: The short name of the custom industry. Required when `industry` is `other`, rejected otherwise.
        timezone:
          type: string
          maxLength: 64
          description: IANA time zone for the company (e.g. `America/Chicago`). Defaults to the formation state's primary zone.
        authorized_shares:
          type: integer
          format: int64
          minimum: 1
          description: Total authorized shares. Required for a c_corp. Not accepted for an llc, which is issued a fixed 100 membership units.
        par_value:
          type: number
          minimum: 0
          description: Par value per share, in dollars. Required for a c_corp. Not accepted for an llc.
        account:
          allOf:
            - $ref: '#/components/schemas/CreateAccountBody'
          description: Account details to create the incorporator alongside this company, when you have not created one yet. Omit it and set the `Clemta-Account` header to create the company under an account that already exists. Pass one or the other, never both. Reusing an account `external_id` returns the account already on file instead of creating a duplicate.
        shareholders:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/CreateShareholderBody'
          description: The company's owners, as structured data. Optional at create - owners can also be collected later through the embedded form. Identity documents are never sent here. Upload them through the Files API and reference them by `passport`. When present, exactly one owner must be the main incorporator.
        officers:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CreateOfficerBody'
          description: 'The management roster - everyone who holds a position, each with their roles. A director is an officer holding role `director`. There is no separate directors list. Optional: when omitted, a shareholder''s `relationship.director` flag seats directors. When given, this list is the roster. An officer whose `email` matches a shareholder''s is seated as that owner.'
        management_type:
          type: string
          enum:
            - member_managed
            - manager_managed
          description: LLC only - whether the company is member-managed or manager-managed.
        services:
          type: array
          maxItems: 25
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]{1,48}$
          description: Products to order on the company at creation, by key - the same keys `GET /products` lists. Each is attached as a service order and billed to you at your wholesale price, alongside the formation. Formation itself is implied by creating the company and need not be listed here.
          example:
            - ein
            - registered_agent
        service_options:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          description: 'Variant choices for the services attached at creation, keyed by product key - the listed ones, the mandatory ones, the formation itself (`{"formation_llc": {"turnaround": "expedited"}}` is how expedited filing is chosen, and registration is the only moment it can be), and the formation bundle''s included services. A key naming a product that is not being attached is refused.'
          example:
            ein:
              processing: expedited
        metadata:
          type: object
          maxProperties: 50
          additionalProperties: true
          description: Your own key-value pairs, stored and returned verbatim.
    UpdateCompanyBody:
      type: object
      additionalProperties: false
      description: 'Sparse update: only the fields you send change, everything else stays as it is. While the company is `requires_information` (not yet handed to Clemta) the create-time details can still be corrected. After hand-off only `timezone`, `owner_privacy`, `foreign_qualifications` and `metadata` remain updatable - everything else is Clemta''s to change from there. `entity_type`, `state` and `pre_existing` are never updatable: they price the formation - cancel the company and create it again instead.'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9 &-]+$
          description: New legal name (IRS charset, no leading "The"). Before hand-off only.
        ending:
          type: string
          enum:
            - llc
            - l_l_c
            - limited_liability_company
            - inc
            - incorporated
            - co
            - corp
            - corporation
          description: New name suffix token, must match the entity type. Before hand-off only.
        name_style:
          type: string
          enum:
            - plain
            - comma
          description: How the legal name renders around the ending. Before hand-off only.
        owner_privacy:
          type: string
          enum:
            - public
            - private
          description: Whether the owners are kept off the public filing. `private` only in DE, NV, WY, NM. Updatable before and after hand-off.
        industry:
          type: string
          enum:
            - accounting
            - advertising
            - agriculture
            - art
            - theater
            - beauty_and_cosmetic_services
            - biotech
            - business_management
            - cleaning_services
            - construction
            - consulting
            - design
            - e_commerce
            - education
            - entertainment
            - financial_services
            - fitness
            - food
            - hardware
            - health_services
            - insurance
            - investment
            - legal
            - logistics
            - marketing
            - marketplace
            - real_estate
            - recruiting
            - research
            - retail_wholesale
            - shipping_warehousing
            - support_services
            - software
            - technology
            - transportation
            - other
          description: One of the platform catalog's tokens. Before hand-off only.
        industry_description:
          type: string
          maxLength: 500
          description: 'Required alongside `industry: other`, refused otherwise. Before hand-off only.'
        custom_industry:
          type: string
          maxLength: 120
          description: 'The short name of the custom industry. Required alongside `industry: other`, refused otherwise. Before hand-off only.'
        authorized_shares:
          type: integer
          format: int64
          minimum: 1
          description: c_corp only. Before hand-off only.
        par_value:
          type: number
          minimum: 0
          description: c_corp only. Before hand-off only.
        timezone:
          type: string
          maxLength: 64
          description: IANA time zone. Updatable before and after hand-off.
        ein:
          type: string
          maxLength: 12
          pattern: ^[0-9]{2}-?[0-9]{7}$
          description: For a `pre_existing` company only. Before hand-off only.
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: For a `pre_existing` company only. Before hand-off only.
        foreign_qualifications:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ForeignQualification'
          description: Replaces the full list. For a `pre_existing` company, updatable before and after hand-off. An empty array clears it.
        shareholders:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/CreateShareholderBody'
          description: 'The company''s owners. Send this to collect the owners a company was created without, or to correct the roster - before hand-off only. It REPLACES the whole roster and follows the same rules as at create: exactly one main incorporator, ownership totals 100 percent. An individual owner without a `passport` gets an identity-document requirement to fulfill later. An empty array clears the roster.'
        metadata:
          type: object
          maxProperties: 50
          additionalProperties: true
          description: Replaces the company's metadata with this set. Send the full map you want stored. An empty object clears it. Your own key-value pairs, returned verbatim.
    ServiceOrderList:
      type: object
      description: A company's service orders. Unpaginated - the set is small and bounded.
      required:
        - object
        - items
      properties:
        object:
          type: string
          enum:
            - list
          description: Entity name.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOrder'
    CreateServiceOrderBody:
      type: object
      description: 'Attach a product to a company. Idempotent - one order per product per company, unless the product''s `repeat` policy allows more: then each instance (a tax year, a state, a bank, an owner, or simply the nth request) is its own order.'
      required:
        - product_key
      properties:
        product_key:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[a-z][a-z0-9_]{1,48}$
          description: The product to order, by key. Must be an active product in your catalog.
          example: ein
        options:
          type: object
          maxProperties: 10
          additionalProperties:
            type: string
            pattern: ^[a-z][a-z0-9_]{1,48}$
          description: Your choice for each of the product's `options` (key -> value), as listed on `GET /products`. A required option that is missing, an unknown key, or an unknown value answers `400 invalid_request` with one `errors[]` entry per problem.
          example:
            llc_members: multi_member
        shareholder:
          type: string
          pattern: ^sh_[0-9A-Za-z]{22}$
          description: 'The company owner this order is for. Required exactly when the product repeats per owner (`repeat: per_shareholder` - an ITIN application). Refused on every other product.'
        form:
          type: array
          maxItems: 100
          description: Optionally answer the first form step in the same call - for services whose first step collects input (e.g. an EIN's SS-4 or an operating agreement's details), the order kicks off fully in one request.
          items:
            $ref: '#/components/schemas/ServiceFormField'
    UpdateServiceOrderBody:
      type: object
      description: 'Two order actions share this endpoint: upgrading the order''s options, and accepting a Clemta-set quote. Send exactly one of them.'
      properties:
        options:
          type: object
          additionalProperties:
            type: string
          description: The order's new variant choices, complete - the same shape the create call takes. Unchanged keys may be repeated. The change must not lower the price, and an option marked `fixed` in the catalog cannot change.
          example:
            turnaround: expedited
        accept_quote:
          type: boolean
          description: Accept the Clemta-set price on a quote_pending order. The quoted amount becomes the order's price and is billed at that moment. Refused before a price exists or after `quote.expires_at`. Idempotent once accepted.
    ProductOptionValue:
      type: object
      description: One choice on a product option.
      required:
        - value
        - label
      properties:
        value:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,48}$
          description: The value you send in `options`.
          example: multi_member
        label:
          type: string
          example: Multi-member LLC
        available_when:
          type: object
          additionalProperties: true
          description: When present, this value may only be chosen for companies matching the condition - for example an expedited filing offered in certain states only. Choosing it elsewhere is refused naming the option.
        unit_amount:
          type: integer
          format: int64
          minimum: 0
          description: The wholesale price of the product when this value is chosen, in the currency's smallest unit. Absent means the product's own price applies. If Clemta set you an override on the product, the override applies whatever you choose.
          example: 24900
    ProductOption:
      type: object
      description: One variant axis of a product - a choice made at order time. Pass your choice as `options[<key>] = <value>` when creating a service order.
      required:
        - key
        - label
        - values
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,48}$
          description: The option's identifier, the key you send in `options`.
          example: llc_members
        fixed:
          type: boolean
          description: A fixed option is chosen at order time and is never upgradable later. The options-upgrade endpoint refuses to change it.
        label:
          type: string
          description: Human-readable name of the choice.
          example: LLC membership
        required:
          type: boolean
          description: True when an order for this product must choose a value.
        values:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProductOptionValue'
    PriceRule:
      type: object
      description: One conditional price point. When `match` holds against the company the order is for, the order prices at `unit_amount` instead of the product default - rules are evaluated in order and the first match wins. The condition is answered by the company record itself, so there is nothing extra to send on the order.
      required:
        - key
        - match
        - unit_amount
      properties:
        key:
          type: string
          description: Stable identifier of the rule.
          example: de_filing
        label:
          type: string
          description: Display name, when one is set.
          example: Delaware filing
        match:
          type: object
          additionalProperties: true
          description: Condition over the company attributes `entity_type`, `state`, `pre_existing` and `owners_count`, in query-operator form - a plain value means equality, `$in`, `$gte`, `$and`, `$or` and friends are supported.
          example:
            state: DE
        unit_amount:
          type: integer
          format: int64
          minimum: 0
          description: Your price in the currency's smallest unit (cents) when the rule matches.
          example: 31500
    Product:
      type: object
      description: A product you can offer, priced at your wholesale rate.
      required:
        - object
        - key
        - display_name
        - unit_amount
        - currency
      properties:
        object:
          type: string
          enum:
            - product
          description: Entity name.
        key:
          type: string
          description: The identifier you order by - pass it as `product_key` on a service order.
          example: formation_llc
        display_name:
          type: string
          example: Company Formation (LLC)
        unit_amount:
          type: integer
          format: int64
          minimum: 0
          description: Your wholesale price in the currency's smallest unit (cents) - your override if you have one, otherwise the default.
          example: 14900
        currency:
          type: string
          example: usd
        interval:
          type: string
          enum:
            - one_time
            - monthly
            - yearly
          description: Billing cadence - one_time, or recurring monthly/yearly.
        trial_periods:
          type: integer
          description: How many opening billing intervals are free on this product - for example 1 on a yearly service whose first year is included, or 12 on a monthly fee that starts billing after a year. An order created for it carries no charge until the first paid period arrives. Absent or 0 means billing starts at creation.
        billing:
          type: string
          enum:
            - advance
            - arrears
          description: When a recurring period is billed. `advance` bills the first period at order creation and every later one at its start. `arrears` bills each period at its end instead - the order is created with no charge and the first invoice line lands one interval later. Absent means advance.
        includes:
          type: array
          items:
            type: string
          description: Products an order for this one attaches automatically at no extra charge - each appears as its own order marked `included_in`, with its own status and events. The formation's bundle (registered agent, business address, EIN, bank application) is the live case.
        description:
          type: string
          description: What the product is, expected timelines, and any disclaimers - shown to you verbatim. Carry the disclaimers into your own client-facing copy (e.g. a business mailing address is not proof of physical presence, bank approval is the institution's decision).
        quote:
          type: boolean
          description: 'Priced per order: the order opens unbilled in `quote_pending`, Clemta reviews the work and sets the price (`service_order.quoted`), and billing happens when you accept it. `unit_amount` on this product is indicative only.'
        on_complete:
          type: string
          description: 'A company-level effect the order''s completion fires. Today only `dissolve_company` - the dissolution product: completing it closes the company (terminal `dissolved` status, renewals ended, open requirements closed).'
        repeat:
          type: string
          description: The product's repeatability. Absent means one order per company. `per_order` means every purchase is its own instance. `per_option:<key>` means one order per value of that option (a filing per tax_year, a registration per state). `per_shareholder` means one order per company owner, named by `shareholder` on the order.
        conflicts_with:
          type: array
          items:
            type: string
          description: Products this one cannot be held together with - ordering it while the company holds one of these (or the same creation basket carries one) is refused.
        depends_on:
          type: array
          items:
            type: string
          description: Products that must already be ordered on the company before this one can be - a missing prerequisite is refused naming the key.
        defer_first_charge:
          type: string
          enum:
            - first_anniversary
          description: 'When present, an order created before the stated anchor bills nothing at creation: for first_anniversary the first charge lands one interval after the company''s incorporation date. Ordered after the anniversary, it bills at creation as usual.'
        pass_through_fees:
          type: string
          enum:
            - annual_state_filing
            - trademark_government
            - sales_tax_government
            - amendment_government
            - dissolution_government
            - cogs_government
          description: When present, an order for this product also bills government or state fee lines beside the product price, at the amounts current at order time. annual_state_filing adds the state's own annual report / franchise charge and the processing fee. The others add that filing's government fee. Each appears as its own line on your statement and on the order's `fees`.
        required_for:
          type: array
          items:
            type: string
            enum:
              - formation
              - existing
          description: 'Which companies this product is mandatory on: `formation` (companies Clemta forms) and/or `existing` (pre-existing companies you bring in). Creating such a company attaches and bills it automatically - include it in your own pricing.'
        options:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ProductOption'
          description: The product's variants, when it has any. Each is a choice made at order time. A `required` one must be sent in `options` on the service order.
        price_rules:
          type: array
          items:
            $ref: '#/components/schemas/PriceRule'
          description: Conditional amounts for this product, applied automatically from the company the order is for - nothing extra to send. Evaluated in order, first match wins. No match pays `unit_amount`.
        fulfillment:
          type: string
          enum:
            - workflow
            - entitlement
          default: workflow
          description: What the fulfilment is. `workflow` - Clemta fulfils the order step by step, possibly asking for forms (follow `status` / requirements). `entitlement` - the order grants the company a right (a tax-filing credit, for instance) that is then exercised in the company's own flow. An entitlement order completes at provisioning and never asks for a form.
        available_when:
          type: object
          additionalProperties: true
          description: Who this product can be ordered to, as a match condition over the company attributes entity_type, state, pre_existing and owners_count. Empty or absent means every company. An order for a company outside it is refused.
          example:
            entity_type: llc
    ProductList:
      type: object
      description: Your catalog. Unpaginated - the set is small and bounded.
      required:
        - object
        - items
      properties:
        object:
          type: string
          enum:
            - list
          description: Entity name.
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    PricePreviewFee:
      type: object
      description: One prospective pass-through line - a government or state fee.
      required:
        - kind
        - unit_amount
        - currency
      properties:
        kind:
          type: string
          description: The fee's stable kind, the same value the order's `fees` carry.
          example: state_fee
        unit_amount:
          type: integer
          format: int64
          description: Today's amount in cents.
        currency:
          type: string
          example: usd
    PricePreview:
      type: object
      description: Every line an order for this product COULD put on your statement, resolved for the stated company profile. Amounts are today's - the order resolves them again and freezes what it billed on the order's own `fees` - so treat this as an estimate, never a quote.
      required:
        - object
        - product_key
        - unit_amount
        - currency
        - estimate
      properties:
        object:
          type: string
          enum:
            - price_preview
          description: Entity name.
        product_key:
          type: string
          example: annual_state_filing
        display_name:
          type: string
        unit_amount:
          type: integer
          format: int64
          description: Your price for this product and profile, in cents - your override or a matching price rule when one applies, otherwise the default.
        currency:
          type: string
          example: usd
        interval:
          type: string
          enum:
            - one_time
            - monthly
            - yearly
        overridden:
          type: boolean
          description: True when your negotiated sheet priced this product.
        applied_rule:
          type: string
          description: The price rule that decided `unit_amount` for this profile, when one matched - why this profile pays this amount.
        options:
          type: array
          items:
            $ref: '#/components/schemas/ProductOption'
          description: The product's variants with each value's own effective amount - a chosen value's amount replaces `unit_amount`.
        fees:
          type: array
          items:
            $ref: '#/components/schemas/PricePreviewFee'
          description: The pass-through government and state fee lines an order would bill beside the product, at today's amounts. A fee the state does not charge (or whose price is not configured yet) produces no line.
        estimate:
          type: boolean
          enum:
            - true
          description: Always true - amounts here are resolved now. The order's own resolution governs and is frozen on the order.
    CompanyPricePreviewBody:
      type: object
      description: The price-relevant slice of a company create - enough to resolve the whole basket.
      required:
        - entity_type
        - state
      properties:
        entity_type:
          type: string
          enum:
            - llc
            - c_corp
        state:
          type: string
          pattern: ^[A-Za-z]{2}$
          description: The formation state, as a 2-letter code.
          example: DE
        pre_existing:
          type: boolean
          description: Preview for a pre-existing company you bring in (no formation line). Defaults to false.
        has_ein:
          type: boolean
          description: Whether the pre-existing company you bring in already holds an EIN. Only a pre_existing company can (a formation is assigned one later), so it is ignored otherwise. It changes which services are available - an EIN service is for companies without one. Defaults to false.
        owners_count:
          type: integer
          minimum: 1
          maximum: 100
          description: How many owners the company has. Defaults to 1.
        services:
          type: array
          description: Service product keys to attach. Mandatory services are added automatically whether or not they are listed.
          items:
            type: string
        formation_options:
          type: object
          additionalProperties:
            type: string
          description: Option choices for the formation itself, e.g. `{"turnaround":"expedited"}`.
        service_options:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          description: Per-service option choices, keyed by product key, e.g. `{"ein":{"turnaround":"expedited"}}`.
    CompanyBasketLine:
      type: object
      description: One prospective charge of a company create - the formation or a service, with its own amount, interval and any pass-through fees.
      required:
        - kind
        - product_key
        - unit_amount
        - currency
      properties:
        kind:
          type: string
          enum:
            - formation
            - service
          description: Whether this line is the formation itself or a service on it.
        product_key:
          type: string
          example: registered_agent
        unit_amount:
          type: integer
          format: int64
          description: Your wholesale amount in cents (the override, a matching rule, or the default), or the chosen option's amount when one is picked.
        currency:
          type: string
          example: usd
        interval:
          type: string
          description: How this line bills - one_time, monthly or yearly.
          example: one_time
        required:
          type: boolean
          description: True when the profile auto-attaches this service (mandatory), rather than the caller listing it.
        applied_rule:
          type: string
          description: The price rule that decided the amount, absent when the default or an override priced it.
        fees:
          type: array
          description: Pass-through government or state fee lines for this product, at today's amounts.
          items:
            $ref: '#/components/schemas/PricePreviewFee'
    CompanyPricePreview:
      type: object
      description: 'Every line a company create would bill for a stated profile, before anything exists: the formation with its state filing fee, every mandatory service the profile auto-attaches, and every service listed. Each line carries its own interval - they are not summed, since a one-time formation and a yearly service are not one number. Amounts are estimates: the create resolves again and freezes what it billed.'
      required:
        - object
        - currency
        - lines
      properties:
        object:
          type: string
          enum:
            - company_price_preview
          description: Entity name.
        currency:
          type: string
          example: usd
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CompanyBasketLine'
    StatusToken:
      type: object
      description: A read-only status link you hand to an end customer.
      required:
        - object
        - id
        - created_at
      properties:
        object:
          type: string
          enum:
            - status_token
          description: Entity name.
        id:
          type: string
          pattern: ^stok_[0-9A-Za-z]{22}$
          description: The token's management id - revoke by this.
        url:
          type: string
          description: The keyless status link, shown once at creation and never returned again.
        created_at:
          type: string
          format: date-time
    StatusTokenList:
      type: object
      description: A company's status links. Unpaginated - the set is small.
      required:
        - object
        - items
      properties:
        object:
          type: string
          enum:
            - list
          description: Entity name.
        items:
          type: array
          items:
            $ref: '#/components/schemas/StatusToken'
    StatusService:
      type: object
      description: One service on the status view - no price, no personal data.
      required:
        - object
        - product_key
        - status
      properties:
        object:
          type: string
          enum:
            - status_service
          description: Entity name.
        product_key:
          type: string
          example: ein
        status:
          type: string
          example: in_progress
    StatusView:
      type: object
      description: 'A company''s live status as an end customer sees it: where the formation and services stand, and nothing else. No documents, no personal data, no prices.'
      required:
        - object
        - company_name
        - state
        - entity_type
        - status
        - verification
        - services
        - updated_at
      properties:
        object:
          type: string
          enum:
            - status
          description: Entity name.
        company_name:
          type: string
        state:
          type: string
        entity_type:
          type: string
        status:
          type: string
          description: Formation status.
        verification:
          type: string
          description: Verification state.
        services:
          type: array
          items:
            $ref: '#/components/schemas/StatusService'
        updated_at:
          type: string
          format: date-time
    Invoice:
      type: object
      description: A wholesale invoice raised on your account at month end.
      required:
        - object
        - id
        - amount_due
        - amount_paid
        - currency
        - status
        - created_at
      properties:
        object:
          type: string
          enum:
            - invoice
          description: Entity name.
        id:
          type: string
          description: The invoice identifier.
          example: in_1QabcXYZ
        number:
          type: string
          description: The human-facing invoice number, once assigned.
        amount_due:
          type: integer
          format: int64
          description: Amount due in the currency's smallest unit (cents).
          example: 43600
        amount_paid:
          type: integer
          format: int64
          description: Amount paid so far, in cents.
        currency:
          type: string
          example: usd
        status:
          type: string
          description: 'Invoice status: open, paid, uncollectible, or void.'
          example: open
        hosted_url:
          type: string
          description: A short-lived link to the hosted invoice, when available.
        created_at:
          type: string
          format: date-time
    File:
      type: object
      description: 'A file: either a document Clemta published on one of your companies (`source: operations` - Articles, an EIN letter, a filed form - download the bytes from the content endpoint) or one you uploaded (`source: upload` - write-only, attach it by id). Nothing about storage is ever exposed - no URLs, no keys. Uploaded contents cannot be read back.'
      required:
        - object
        - id
        - name
        - livemode
        - created_at
      properties:
        object:
          type: string
          enum:
            - file
          description: Entity name.
        id:
          type: string
          pattern: ^file_[0-9A-Za-z]{22}$
          example: file_0346sFPEvSkJvY8vt14NNw
        company:
          type: string
          pattern: ^cmp_[0-9A-Za-z]{22}$
          description: The company this document belongs to. Absent on an upload not yet attached.
        name:
          type: string
          description: The document's filename, extension included.
          example: Articles_of_Incorporation.pdf
        content_type:
          type: string
          example: application/pdf
        size:
          type: integer
          format: int64
          description: Size in bytes, when known.
        purpose:
          type: string
          enum:
            - identity_document
            - formation_document
            - additional_document
            - tax_form_1099
            - business_logo
            - business_icon
          description: What an uploaded file is for. Absent on documents Clemta published.
        source:
          type: string
          enum:
            - operations
            - upload
          description: 'Who put the file here. `operations` - a deliverable we published, its bytes downloadable from the content endpoint. `upload` - you sent it (POST /v1/files), write-only: reference it by id, its contents can never be read back.'
        url:
          type: string
          description: Where the file's contents can be downloaded, with your API key. Present only when the purpose allows downloading - Clemta-published deliverables, never your own uploads.
        consumed:
          type: boolean
          description: True once an upload has been attached. Uploads are single-use.
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
    TaxFiling:
      type: object
      description: One federal or state tax filing on a company. Open it over the API, fill the form, and submit it - or your client can open and fill it themselves. The filing entitlement is spent at submit. Follow progress with `tax_filing.created` / `tax_filing.status.changed`.
      required:
        - object
        - id
        - company
        - year
        - type
        - status
        - livemode
        - created_at
      properties:
        object:
          type: string
          enum:
            - tax_filing
          description: Entity name.
        id:
          type: string
          pattern: ^txf_[0-9A-Za-z]{22}$
          example: txf_0346sFPEvSkJvY8vt14NNw
        company:
          type: string
          pattern: ^cmp_[0-9A-Za-z]{22}$
        year:
          type: integer
          format: int64
          description: The filing year.
          example: 2025
        type:
          type: string
          enum:
            - federal
            - state
        status:
          type: string
          enum:
            - draft
            - in_review
            - accepted
            - rejected
          description: 'Review outcome: `draft` while the client fills it in, `in_review` once submitted to Clemta, then `accepted` or `rejected`.'
        progress:
          type: string
          enum:
            - draft
            - in_progress
            - additional_info
            - signature_requested
            - return_ready
            - completed
          description: Where Clemta has the return. `additional_info` and `signature_requested` need the client. `return_ready` means the return is available in the company's documents. `completed` is filed.
        form:
          $ref: '#/components/schemas/TaxFilingForm'
          description: The questionnaire as currently stored. Present on the detail read and on write answers, absent on the list.
        form_1099_count:
          type: integer
          description: How many IRS-1099 files are attached to the filing, however they were attached them. Present on the detail read and on write answers.
        submittable:
          type: boolean
          description: True when the filing is a draft with every required section in place. Present on the detail read and on write answers.
        missing:
          type: array
          items:
            $ref: '#/components/schemas/TaxFilingGap'
          description: What still keeps the filing from being submitted, field by field. Empty when `submittable` is true. Present on the detail read and on write answers.
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CalendarEvent:
      type: object
      description: One compliance calendar item on a company - an annual report deadline, a franchise tax date. Read them from the calendar endpoint, and receive a `calendar.reminder` webhook ahead of each one. No mail is sent to your client. The notification channel is yours.
      required:
        - object
        - id
        - company
        - title
        - due_at
        - livemode
      properties:
        object:
          type: string
          enum:
            - calendar_event
          description: Entity name.
        id:
          type: string
          pattern: ^cal_[0-9A-Za-z]{22}$
          example: cal_0346sFPEvSkJvY8vt14NNw
          description: The calendar entry's identifier, stable across reads.
        company:
          type: string
          pattern: ^cmp_[0-9A-Za-z]{22}$
          description: The company the deadline is on.
        title:
          type: string
          example: Annual Report Filing
        description:
          type: string
          description: What is due and what happens if it is missed.
        due_at:
          type: string
          format: date-time
          description: When the item is due.
        end_at:
          type: string
          format: date-time
          description: The end of the window, when the item spans one.
        all_day:
          type: boolean
          description: True when the item is a date rather than a moment.
        remind_at:
          type: string
          format: date-time
          description: 'On a `calendar.reminder` event only: the reminder point that fired. Absent on calendar reads.'
        livemode:
          type: boolean
    TaxFilingCorpInfo:
      type: object
      additionalProperties: false
      description: The filing's corporate identity. Prefilled from the company when the filing is created - send only what differs.
      properties:
        name:
          type: string
          maxLength: 255
          description: Legal company name as it should appear on the return.
        state:
          type: string
          minLength: 2
          maxLength: 2
          description: Two-letter formation state code.
        entity_type:
          type: string
          enum:
            - llc
            - c_corp
        industry:
          type: string
          maxLength: 255
        parent_company:
          type: string
          maxLength: 255
          description: The parent company's name, when one exists.
        ein:
          type: string
          maxLength: 20
          description: Employer Identification Number, 12-3456789.
        formation_date:
          type: string
          maxLength: 20
          description: Formation date as shown on the formation documents.
        initial_return:
          type: boolean
          description: True when this is the company's first return.
        issued_shares:
          type: integer
          format: int64
          minimum: 0
        gross_assets:
          type: number
          minimum: 0
        dba:
          type: string
          maxLength: 255
          description: Doing-business-as name, when one exists.
        principal_business_activity:
          type: string
          maxLength: 500
    TaxFilingContact:
      type: object
      additionalProperties: false
      description: Who Clemta reaches with questions about the return.
      properties:
        address:
          $ref: '#/components/schemas/Address'
        phone:
          type: string
          minLength: 7
          maxLength: 20
          pattern: ^[0-9+()\s.-]+$
          description: Digits with optional `+`, spaces, and `()`.-` separators - the same shape phone takes everywhere on this API.
        phone_country:
          type: string
          pattern: ^[A-Za-z]{2}$
          description: The phone's ISO 3166 alpha-2 country code, e.g. `us`. Optional.
        email:
          type: string
          format: email
          maxLength: 255
          description: Required before the filing can be submitted.
        principal_place_of_business:
          $ref: '#/components/schemas/Address'
          description: Where the company is actually administered from. A registered agent address is not accepted here by the state.
    TaxFilingQuestions:
      type: object
      additionalProperties: false
      description: The return's yes/no questions. An omitted answer reads as not answered.
      properties:
        has_employees:
          type: boolean
        made_1099_payments:
          type: boolean
          description: Payments were made that require filing form 1099. When true, the filing cannot be submitted until at least one IRS-1099 file is attached via `form_1099_files`.
        form_1099_files:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: ^file_[0-9A-Za-z]{22}$
          description: 'IRS-1099 files to attach, by file id - upload each via `POST /v1/files` with purpose `tax_form_1099`, then reference the ids here. Write-only and single-use: attached files land with Clemta and the read answers their count as `form_1099_count` on the filing.'
        purchased_assets:
          type: boolean
          description: Assets were purchased during the filing year.
        owns_non_us_corp:
          type: boolean
          description: The company owns a non-US corporation.
        has_us_physical_presence:
          type: boolean
    TaxFilingOwner:
      type: object
      additionalProperties: false
      required:
        - name
      description: 'One owner line on the return - a person or an entity holding equity. The four tax ids are parallel fields, as the return asks them: `ftin` and `itin` are expected for every owner (write "0" where one does not exist), `ssn` belongs to individuals, `ein` to organizations.'
      properties:
        name:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 120
        type:
          type: string
          maxLength: 60
          description: Free-form kind, e.g. Individual or Organization.
        ftin:
          type: string
          maxLength: 40
          description: Foreign tax identification number issued by the owner's home country. Expected for every owner - write "0" when the owner has none.
        itin:
          type: string
          maxLength: 20
          description: IRS individual taxpayer identification number. Expected for every owner - write "0" when the owner has none.
        ssn:
          type: string
          pattern: ^\d{3}-\d{2}-\d{4}$
          description: US Social Security Number, individuals only, when available.
        ein:
          type: string
          pattern: ^\d{2}-\d{7}$
          description: Employer Identification Number, organization owners only, when available.
        phone:
          type: string
          maxLength: 32
        address:
          $ref: '#/components/schemas/Address'
        capital_contributions:
          type: number
          minimum: 0
        percentage_owned:
          type: number
          minimum: 0
          maximum: 100
    TaxFilingSales:
      type: object
      additionalProperties: false
      description: The sales block of the revenue and expenses section.
      properties:
        gross_sales:
          type: number
          minimum: 0
        returns_and_allowances:
          type: number
          minimum: 0
        sales:
          type: number
          minimum: 0
    TaxFilingCogs:
      type: object
      additionalProperties: false
      description: The cost-of-goods-sold block of the revenue and expenses section.
      properties:
        beginning_inventory:
          type: number
          minimum: 0
        purchases:
          type: number
          minimum: 0
        ending_inventory:
          type: number
          minimum: 0
    TaxFilingRevenueExpenses:
      type: object
      additionalProperties: false
      description: The federal filing's numbers - sales, cost of goods sold, and expenses by category. Required before a federal filing can be submitted.
      properties:
        sales:
          $ref: '#/components/schemas/TaxFilingSales'
        cost_of_goods_sold:
          $ref: '#/components/schemas/TaxFilingCogs'
        expenses:
          type: object
          additionalProperties:
            type: number
          description: Expense amounts keyed by category. Accepted keys - accounting, advertising, bad_debts, bank_charge, cell_phone, commission, consulting, delivery, dues_and_subscriptions, education_and_training, employee_benefit, entertainment, fuel, guaranteed_payment, insurance, general, building_and_equipment, liability, workers_compensation, other_insurance, internet_service, janitorial, legal, marketing, office_expense, parking_tolls, payroll, payroll_processing_service, permit_and_fees, postage_shipping, printing, recruiting, rent, repair_and_maintenance, software, taxes_and_licenses, telephone, travel, utilities, waste_removal, other. An unknown key is refused with a suggestion.
        principal_business_activity:
          type: string
          maxLength: 500
    TaxFilingBalanceSheet:
      type: object
      additionalProperties: false
      description: The state filing's balance sheet. Required before a state filing can be submitted.
      properties:
        lines:
          type: object
          additionalProperties:
            type: number
          description: Balance sheet amounts keyed by line. Accepted keys - cash, trade_notes_and_accounts_receivable, subtract_allowance_for_bad_debts, inventories, government_obligations, tax_exempt_securities, other_current_assets, loan_to_shareholders, mortgage_and_real_estate_loans, other_investments, buildings_and_other_depreciable, depletable_assets, land, intangible_assets, subtract_accumulated_amortization, other_assets. An unknown key is refused with a suggestion.
        principal_business_activity:
          type: string
          maxLength: 500
    TaxFilingFixedAsset:
      type: object
      additionalProperties: false
      required:
        - title
      description: One depreciable asset line on the filing. Read-only and register-derived - manage assets with the fixed-assets API. Same shape as the FixedAsset resource.
      properties:
        title:
          type: string
          maxLength: 255
        placed_in_service:
          type: string
          format: date
          description: The date the asset was placed in service (YYYY-MM-DD).
        cost:
          type: number
          format: double
          minimum: 0
        salvage_value:
          type: number
          format: double
          minimum: 0
        business_use:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Business-use percentage.
    TaxFilingPerson:
      type: object
      additionalProperties: false
      required:
        - first_name
        - last_name
      description: An officer or director line on the return.
      properties:
        first_name:
          type: string
          maxLength: 120
        last_name:
          type: string
          maxLength: 120
        title:
          type: string
          maxLength: 120
        address:
          $ref: '#/components/schemas/Address'
    TaxFilingForm:
      type: object
      additionalProperties: false
      description: The filing questionnaire. Every section is optional on a write - a section you send replaces the stored one whole, a section you omit stays as it is. Federal filings use `revenue_expenses`, state filings use `balance_sheet`.
      properties:
        corp_info:
          $ref: '#/components/schemas/TaxFilingCorpInfo'
        contact:
          $ref: '#/components/schemas/TaxFilingContact'
        additional_questions:
          $ref: '#/components/schemas/TaxFilingQuestions'
        owners:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TaxFilingOwner'
          description: The equity holders as they should appear on the return.
        revenue_expenses:
          $ref: '#/components/schemas/TaxFilingRevenueExpenses'
        balance_sheet:
          $ref: '#/components/schemas/TaxFilingBalanceSheet'
        fixed_assets:
          type: array
          maxItems: 200
          readOnly: true
          description: Read-only. The company's fixed assets are drawn from its register at save time - manage them with the fixed-assets API (`/v1/companies/{id}/fixed-assets`), not here. Any value sent in this field is ignored.
          items:
            $ref: '#/components/schemas/TaxFilingFixedAsset'
        officers:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TaxFilingPerson'
        directors:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TaxFilingPerson'
    TaxFilingGap:
      type: object
      required:
        - field
        - reason
      additionalProperties: false
      description: One unmet requirement keeping the filing from being submitted.
      properties:
        field:
          type: string
          description: Dotted path of the missing field or section, e.g. `contact.email`.
          example: contact.email
        reason:
          type: string
          enum:
            - required
            - required_for_federal
            - required_for_state
            - required_when_1099
            - unsupported_state
          description: Why the field is needed. `required` is always needed, `required_for_federal` and `required_for_state` are needed for that filing type, `required_when_1099` is needed once the filing reports 1099 payments, and `unsupported_state` means the company's state is not filable.
    EventData:
      type: object
      required:
        - object
      additionalProperties: false
      description: 'The event''s payload: the resource the event is about, embedded as of when the event occurred. This is a point-in-time snapshot, not a live read - a delivery that arrives late still carries the state that triggered it.'
      properties:
        object:
          description: The resource this event concerns, tagged by its own `object` field. A company today. More resource types are added over time, so switch on `object` rather than assuming a shape.
          oneOf:
            - $ref: '#/components/schemas/Company'
            - $ref: '#/components/schemas/ServiceOrder'
            - $ref: '#/components/schemas/Invoice'
            - $ref: '#/components/schemas/Requirement'
            - $ref: '#/components/schemas/File'
            - $ref: '#/components/schemas/TaxFiling'
            - $ref: '#/components/schemas/CalendarEvent'
          discriminator:
            propertyName: object
            mapping:
              company: '#/components/schemas/Company'
              service_order: '#/components/schemas/ServiceOrder'
              invoice: '#/components/schemas/Invoice'
              requirement: '#/components/schemas/Requirement'
              file: '#/components/schemas/File'
              tax_filing: '#/components/schemas/TaxFiling'
              calendar_event: '#/components/schemas/CalendarEvent'
    Event:
      type: object
      required:
        - object
        - id
        - type
        - data
        - livemode
        - created_at
        - timestamp
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - event
          description: Entity name. Identifies this object when it arrives without its URL.
        id:
          type: string
          pattern: ^evt_[0-9A-Za-z]{22}$
          description: Identifier of the event.
          example: evt_0346sFPEvSkJvY8vt14NNw
        type:
          type: string
          description: What happened, e.g. `company.created`, `company.status.changed`, `company.verified`. Branch on this. New types may be added over time, so treat an unrecognized one as informational rather than an error.
        company_id:
          type: string
          pattern: ^cmp_[0-9A-Za-z]{22}$
          description: The company the event is about, when it is about one.
        data:
          $ref: '#/components/schemas/EventData'
        livemode:
          type: boolean
          description: False for an event recorded in a test-key stream.
        timestamp:
          type: string
          format: date-time
          description: 'When the fact the event describes occurred, ISO 8601 - the Standard Webhooks envelope field. Usually identical to `created_at`, because events are recorded in the same transaction as their change. Where a truer stamp exists it is used instead and can PRECEDE `created_at`: `company.incorporated` carries the incorporation stamp itself, which can predate when the event was recorded, and `calendar.reminder` carries the remind moment. Filter and page by `created_at` (the record clock). Read `timestamp` for when it happened. The time of a delivery ATTEMPT is a third thing and never appears in the payload - it is the `webhook-timestamp` header, fresh on every retry.'
        created_at:
          type: string
          format: date-time
          description: When the event was recorded.
    EventList:
      type: object
      required:
        - object
        - page
        - items
      properties:
        object:
          type: string
          enum:
            - list
          description: Entity name.
        page:
          $ref: '#/components/schemas/Page'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    SandboxTaxFiling:
      type: object
      description: The tax filing to open or move (sandbox).
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - federal
            - state
        year:
          type: integer
          format: int64
          description: Filing year. Defaults to the current year.
        status:
          type: string
          enum:
            - draft
            - in_review
            - accepted
            - rejected
          default: draft
        progress:
          type: string
          enum:
            - draft
            - in_progress
            - additional_info
            - signature_requested
            - return_ready
            - completed
          default: draft
    SandboxSimulateBody:
      type: object
      required:
        - event
      additionalProperties: false
      description: Which event to simulate on a test company. The company (or its order, filing, file) is moved exactly as a live change would move it, then the event is delivered to your test webhooks - so every handler can be rehearsed against the real behaviour. Only the fields the event uses are read.
      properties:
        event:
          type: string
          enum:
            - company.status.changed
            - company.incorporated
            - company.verified
            - company.name.changed
            - company.ein.assigned
            - company.entitlements.changed
            - service_order.status.changed
            - service_order.completed
            - tax_filing.created
            - tax_filing.status.changed
            - file.created
            - requirement.created
            - invoice.finalized
          description: 'The event to produce. Events with a once-only rule keep it here too: `company.incorporated` fires the first time only. A bounce through `company.status.changed` back to `active` fires `status.changed` and not `incorporated` again.'
        status:
          type: string
          enum:
            - in_progress
            - active
            - cancelled
          description: For `company.status.changed` - the status to move to. Moving to `active` the first time also fires `company.incorporated`.
        name:
          type: string
          maxLength: 200
          description: For `company.name.changed` - the new legal name.
        ein:
          type: string
          pattern: ^[0-9]{2}-[0-9]{7}$
          description: For `company.ein.assigned`. A second, different EIN updates the field without firing again.
        entitlements:
          $ref: '#/components/schemas/CompanyEntitlements'
        order:
          type: string
          pattern: ^so_[0-9A-Za-z]{22}$
          description: For `service_order.*` - the test order on this company.
        step:
          type: string
          maxLength: 100
          description: For `service_order.status.changed` - the workflow step name to move the order to.
        form_required:
          type: boolean
          description: For `service_order.status.changed` - whether the step waits on a form (opens a `form` requirement, status `requires_action`).
        completed:
          type: boolean
          description: For `service_order.status.changed` - whether the step is the final one (status `completed`, fires `service_order.completed` once).
        tax_filing:
          $ref: '#/components/schemas/SandboxTaxFiling'
        file_name:
          type: string
          maxLength: 200
          description: For `file.created` - the document's filename. A placeholder PDF is served from the file's content endpoint.
        message:
          type: string
          maxLength: 500
          description: For `requirement.created` - the Clemta ask (an `information` requirement).
    Clock:
      type: object
      required:
        - object
        - id
        - livemode
        - simulated_time
        - created_at
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - clock
          description: Entity name.
        id:
          type: string
          example: clk_0346sFPEvSkJvY8vt14NNw
        livemode:
          type: boolean
          description: The mode this clock simulates. A test clock is always available. On the production API a live clock is refused - it is a sandbox rehearsal tool.
        simulated_time:
          type: string
          format: date-time
          description: The moment your simulated world has reached. It starts at the real current time when the clock is created and only ever moves forward. Advancing it processes every renewal and billing event that comes due up to this moment.
        created_at:
          type: string
          format: date-time
        advanced_at:
          type: string
          format: date-time
          description: When the clock was last advanced. Absent until the first advance.
    AdvanceClockBody:
      type: object
      required:
        - to
      additionalProperties: false
      properties:
        to:
          type: string
          format: date-time
          description: The moment to advance the simulated world to. Must be after the clock's current simulated_time, at most five years ahead of it per call. Every renewal period due before this moment bills on your ledger during the call, and on a live clock each month boundary crossed drafts that month's statement.
          example: '2027-09-08T00:00:00Z'
    PagedFileList:
      type: object
      required:
        - object
        - page
        - items
      properties:
        object:
          type: string
          enum:
            - list
        page:
          $ref: '#/components/schemas/Page'
        items:
          type: array
          items:
            $ref: '#/components/schemas/File'
    FileList:
      type: object
      description: A company's published documents, newest first.
      required:
        - object
        - items
