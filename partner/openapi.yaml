          type: string
          enum:
            - fixed_asset
          description: Entity name.
        id:
          type: string
          pattern: ^fxa_[0-9A-Za-z]{22}$
          example: fxa_0346sFPEvSkJvY8vt14NNw
        number:
          type: string
          description: The asset's stable display number on the company register, e.g. `AST-3`.
        company:
          type: string
          pattern: ^cmp_[0-9A-Za-z]{22}$
          description: The company this asset belongs to.
        title:
          type: string
          description: What the asset is.
        placed_in_service:
          type: string
          format: date
          description: The date the asset was placed in service (YYYY-MM-DD).
        cost:
