        object:
          type: string
          enum:
            - list
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaxFiling'
    CreateTaxFilingBody:
      type: object
      required:
        - type
      additionalProperties: false
      description: Opens a filing for the current year. The slot is one filing per company, type and year. Creating is free - the filing entitlement is spent at submit, not here - so an abandoned draft never costs a right.
      properties:
        type:
          type: string
          enum:
            - federal
            - state
        form:
          $ref: '#/components/schemas/TaxFilingForm'
          description: Sections to fill at creation. Identity fields prefill from the company - send only what differs.
        submit:
          type: boolean
          description: True runs create, fill and submit as one atomic call - the filing lands with Clemta immediately, or nothing is created at all. Requires a complete form and an available filing entitlement.
    UpdateTaxFilingBody:
      type: object
      required:
        - form
      additionalProperties: false
      description: Replaces the provided form sections on a draft filing. Only drafts are editable - once submitted, changes go through Clemta.
      properties:
        form:
          $ref: '#/components/schemas/TaxFilingForm'
    CalendarEventList:
      type: object
      description: A company's compliance calendar, soonest first. Unpaginated - the set is small and bounded.
      required:
        - object
        - items
      properties:
        object:
          type: string
          enum:
            - list
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEvent'
    FileLink:
      type: object
      description: 'A file link shares one file''s contents with someone who holds no API key: the `url` serves the bytes without authentication until the link expires. Create one to hand a deliverable to your client or a downstream system. Only shareable files can be linked - an identity document can never be turned into a URL.'
      required:
        - object
        - id
        - file
        - url
        - expired
        - livemode
        - created_at
      properties:
        object:
          type: string
          enum:
            - file_link
          description: Entity name.
        id:
          type: string
          pattern: ^link_[0-9A-Za-z]{22}$
          example: link_0346sFPEvSkJvY8vt14NNw
        file:
          type: string
          pattern: ^file_[0-9A-Za-z]{22}$
          description: The file this link serves.
        url:
          type: string
          description: The public contents URL. The URL is the credential - anyone holding it can read the file until the link expires - so treat it like a secret.
        expired:
          type: boolean
          description: Whether the link has expired. Expired links answer 404.
        expires_at:
          type: string
          format: date-time
          description: When the link stops serving. Absent means it never expires.
        livemode:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
          description: Your own key-value notes on the link, stored and returned verbatim.
        created_at:
          type: string
          format: date-time
    PagedFileLinkList:
      type: object
      required:
        - object
        - page
        - items
      properties:
        object:
          type: string
          enum:
            - list
        page:
          $ref: '#/components/schemas/Page'
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileLink'
    CreateFileLinkBody:
      type: object
      required:
        - file
      additionalProperties: false
      properties:
        file:
          type: string
          pattern: ^file_[0-9A-Za-z]{22}$
          description: The file to share.
        expires_at:
          type: string
          format: date-time
          description: When the link stops serving. Omit for a link that never expires.
        metadata:
          type: object
          additionalProperties: true
    UpdateFileLinkBody:
      type: object
      additionalProperties: false
      properties:
        expires_at:
          type: string
          maxLength: 40
          description: An RFC3339 timestamp to move the expiry, or the literal `now` to expire the link immediately - the way to revoke a URL that is already in someone's hands.
        metadata:
          type: object
          additionalProperties: true
          description: Replaces the stored metadata when present.
    RequirementList:
      type: object
      description: Your requirements, newest first.
      required:
        - object
        - items
      properties:
        object:
          type: string
          enum:
            - list
        items:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
    FulfillRequirementBody:
      type: object
      description: 'What fulfills the requirement: answers for a `form`, `name_change` or `information` requirement, a file for a `document` one. Files are uploaded first (POST /v1/files, with the purpose the requirement names) and attached here by id.'
      properties:
        document:
          type: string
          pattern: ^file_[0-9A-Za-z]{22}$
          description: 'For a `document` requirement: the uploaded file that fulfills it, by id. Single-use.'
        documents:
          type: array
          maxItems: 5
          items:
            type: string
            pattern: ^file_[0-9A-Za-z]{22}$
          description: 'For a `document` requirement with several pages (a passport''s front and back): uploaded files, first one primary. Bounded by the purpose''s policy (max_files).'
        values:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ServiceFormField'
          description: The answers. A `name_change` expects one value with key `name`. A `form` takes the keys from the requirement's `form` schema.
    CreateVerificationSessionBody:
      type: object
      required:
        - shareholder
      additionalProperties: false
      properties:
        shareholder:
          type: string
          pattern: ^sh_[0-9A-Za-z]{22}$
          description: The owner whose identity document is being collected.
        embed_origin:
          type: string
          maxLength: 255
          description: 'Frame this session inside your own site: the exact https origin (for example `https://app.yourbrand.com`) the page will be embedded on. The origin must first be registered under your hosted page''s `embed_origins`. Omit it for an ordinary full-page session - the page then refuses to be framed anywhere.'
    VerificationSession:
      type: object
      description: A short-lived hosted-upload session for one owner's identity document. Create one when you need a URL to hand (or redirect) your client to. The page carries your brand and your legal links from the verification page configuration. Sessions are repeatable - mint another when one expires.
      required:
        - object
        - company
        - shareholder
        - url
        - expires_at
        - livemode
      properties:
        object:
          type: string
          enum:
            - verification_session
        company:
          type: string
          pattern: ^cmp_[0-9A-Za-z]{22}$
        shareholder:
          type: string
          pattern: ^sh_[0-9A-Za-z]{22}$
        url:
          type: string
          description: Where to send your client. The URL is the credential - it authorizes exactly this owner's document upload, nothing else - so treat it like a secret and pass it over a secure channel.
        expires_at:
          type: string
          format: date-time
        livemode:
          type: boolean
    CreateSigningSessionBody:
      type: object
      required:
        - requirement
      additionalProperties: false
      properties:
        requirement:
          type: string
          pattern: ^rqmt_[0-9A-Za-z]{22}$
          description: The open signature requirement to mint a session for.
        signer:
          type: string
          maxLength: 254
          description: Which signer this session is for, by email - each signer of a document gets their own session and signs independently. Required when the document has more than one signer. May be omitted when it has exactly one.
        redirect_url:
          type: string
          format: uri
          maxLength: 2048
          description: Where the signing page sends your client AFTER the signature completes - your own dashboard, a thank-you page. https only. Omitted, the page shows its neutral done state and the client closes it.
        embed_origin:
          type: string
          maxLength: 255
          description: 'Frame this session inside your own site: the exact https origin (for example `https://app.yourbrand.com`) the page will be embedded on. The origin must first be registered under your hosted page''s `embed_origins`. Omit it for an ordinary full-page session - the page then refuses to be framed anywhere.'
    SigningSession:
      type: object
      description: A short-lived hosted signing session for one signature requirement. Create one when Clemta opens a signature ask (you hear requirement.created) and hand the URL to your client - they sign inside your branded hosted page, and nobody is emailed automatically - you control delivery. Sessions are repeatable. Mint another when one expires. When the document is signed the requirement resolves and you hear requirement.fulfilled.
      required:
        - object
        - company
        - requirement
        - url
        - expires_at
        - livemode
      properties:
        object:
          type: string
          enum:
            - signing_session
        company:
          type: string
          pattern: ^cmp_[0-9A-Za-z]{22}$
        requirement:
          type: string
          pattern: ^rqmt_[0-9A-Za-z]{22}$
        url:
          type: string
          description: Where to send your client. The URL is the credential - treat it like a secret and pass it over a secure channel.
        expires_at:
          type: string
          format: date-time
        livemode:
          type: boolean
    SupplySignerEmailBody:
      type: object
      required:
        - requirement
        - signer
        - email
      additionalProperties: false
      properties:
        requirement:
          type: string
          pattern: ^rqmt_[0-9A-Za-z]{22}$
          description: The open signature requirement the signer belongs to.
        signer:
          type: string
          pattern: ^sgr_[0-9A-Za-z]{22}$
          description: The deferred signer's ref (from the requirement's `signers`).
        email:
          type: string
          format: email
          maxLength: 254
          description: The signer's email. Screened for disposable domains.
    FixedAsset:
      type: object
      description: 'A depreciable fixed asset on a company''s register. Fixed assets are the source the federal tax filing draws from: when a filing is saved, it snapshots the company''s current assets. Maintain them here and the filing reflects them.'
      required:
