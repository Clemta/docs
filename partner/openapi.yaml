          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The endpoint is sandbox-only and was called with a live key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/create-sandbox-simulation
  /clock:
    get:
      tags:
        - Sandbox
      operationId: getClock
      summary: Read your simulation clock
      description: The clock for the calling key's mode, or 404 when none exists. The clock is a sandbox tool - live keys are refused. Use a test key.
      parameters:
        - $ref: '#/components/parameters/ClemtaVersion'
      responses:
        '200':
          description: The clock.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Live keys cannot use the simulation clock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/get-clock
    post:
      tags:
        - Sandbox
      operationId: createClock
      summary: Create your simulation clock
      description: Opens the clock for the calling key's mode, frozen at the real current time. One clock exists per mode, so creating again returns the existing clock unchanged. While the clock exists, advancing it runs the renewals that come due on your companies forward, so you can test recurring billing without waiting for real time. Deleting it returns the mode to real time.
      parameters:
        - $ref: '#/components/parameters/ClemtaVersion'
      responses:
        '200':
          description: The clock - fresh, or the one that already existed.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Live keys cannot use the simulation clock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/create-clock
    delete:
      tags:
        - Sandbox
      operationId: deleteClock
      summary: Delete your simulation clock
      description: Removes the mode's clock. The simulated world returns to real time. Nothing already billed is undone - periods the clock advanced over stay billed, and renewal dates advanced into the future are simply not due yet.
      parameters:
        - $ref: '#/components/parameters/ClemtaVersion'
      responses:
        '204':
          description: The clock is gone.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Live keys cannot use the simulation clock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/delete-clock
  /clock/advance:
    post:
      tags:
        - Sandbox
      operationId: advanceClock
      summary: Advance your simulation clock
      description: Moves the mode's simulated time forward to `to` and runs the time-driven machinery up to it. Every renewal period that comes due before that moment bills, so a monthly order advanced a year bills twelve periods at once. Advancing changes nothing about how new records stamp their own times. It only decides how far "due" has looked.
      parameters:
        - $ref: '#/components/parameters/ClemtaVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceClockBody'
      responses:
        '200':
          description: The clock at its new simulated time.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Live keys cannot use the simulation clock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/advance-clock
  /files:
    post:
      tags:
        - Files
      operationId: createFile
      summary: Upload a file
      description: 'Upload a file to attach elsewhere by id. Send `multipart/form-data` with a `file` part and a `purpose`. `identity_document` uploads are an owner''s passport or government ID: attach one to a `document` requirement (`document` on fulfill) or directly at company create (`shareholders[].passport`). `additional_document` uploads answer a form''s file field: pass the file id as that field''s value on fulfill. Uploads are single-use and write-only - the response carries no download URL and the contents can never be read back through the API. PDF, JPEG or PNG, 10MB max, and images at most 8000px per side. Content is verified against the declared type.'
