      description: Moves a test company - or one of its orders, tax filings or documents - the way a live change would, and delivers the resulting event(s) to your test webhooks. Available only with a test key (`clmt_test_`). A live key is refused. Nothing reaches Clemta. The response is the company afterwards.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/ClemtaVersion'
      requestBody:
        required: true
