      tags:
        - Webhooks
      operationId: onTaxFilingCreated
      summary: A tax filing was opened
      description: Sent when a federal or state tax filing is opened on the company. `data.object` is the tax filing. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge.
