        page:
          allOf:
            - $ref: '#/components/schemas/HostedPageInfo'
          description: The partner's hosted-page configuration - brand and legal footer.
        embed_url:
          type: string
          description: The embedded signing session the page renders, minted fresh for this page load. Present only while the ask is open.
        embed_origin:
          type: string
          description: The one origin allowed to frame this page, when the session was minted for embedding. The hosted page treats this as the authority and refuses to run framed anywhere else. Absent on ordinary sessions.
    RequirementContext:
      type: object
      description: What a hosted page shows, read through the link's own token - names only, no identifiers, since the holder is your client rather than you.
      required:
        - object
        - type
        - status
      properties:
        object:
          type: string
          enum:
            - requirement_context
          description: Entity name.
        type:
          type: string
          enum:
            - document
            - form
            - name_change
            - information
            - signature
        status:
          type: string
          enum:
            - open
            - resolved
            - canceled
        partner_name:
          type: string
          description: The partner name a hosted page brands itself with, resolved from the link token.
        company_name:
          type: string
        owner_name:
          type: string
        page:
          allOf:
            - $ref: '#/components/schemas/HostedPageInfo'
          description: The partner's hosted-page configuration - brand and legal footer.
        message:
          type: string
        form:
          $ref: '#/components/schemas/ServiceOrderForm'
        embed_origin:
          type: string
          description: The one origin allowed to frame this page, when the session was minted for embedding. The hosted page treats this as the authority and refuses to run framed anywhere else. Absent on ordinary sessions.
  responses:
    BadRequest:
