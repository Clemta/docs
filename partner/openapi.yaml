        href: /api-reference/webhooks/service-order-status-changed
  service_order.completed:
    post:
      tags:
        - Webhooks
      operationId: onServiceOrderCompleted
      summary: A service order was fulfilled
      description: Sent exactly once per order, the first time it reaches `completed` - `completed_at` is set then and never cleared, and a later status echo does not repeat it. The request body is the `event` resource, whose `data.object` is the completed service order. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge - a non-2xx or a timeout is retried with backoff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/service-order-completed
  service_order.updated:
    post:
      tags:
        - Webhooks
      operationId: onServiceOrderUpdated
      summary: A service order was changed outside your own call
      description: 'Sent when an order''s options or price change without you calling - today, Clemta reversing an options upgrade it could not deliver: the difference you were billed is credited back and the order returns to its previous choices and price. The request body is the `event` resource, whose `data.object` is the order as of the change. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge - a non-2xx or a timeout is retried with backoff.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/service-order-updated
  service_order.quoted:
    post:
      tags:
        - Webhooks
      operationId: onServiceOrderQuoted
      summary: Clemta priced a quote order
      description: 'Sent when Clemta set the price on a quote_pending order - a product priced per piece of work, such as catch-up bookkeeping. The request body is the `event` resource, whose `data.object` is the service order carrying its `quote` object: the amount, and `expires_at`, the acceptance window. Accept with `accept_quote: true` on the order update endpoint before the window lapses. Nothing is billed until you do, and cancelling the order declines the quote. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/service-order-quoted
  service_order.renewal_canceled:
    post:
      tags:
        - Webhooks
      operationId: onServiceOrderRenewalCanceled
      summary: A renewal cancellation was approved
      description: Sent when Clemta approves your cancellation request on a recurring order. The service runs to `renewal_ends_at` and is not billed past it - except a product billed in arrears, whose running period still bills at that moment, since it was served. The request body is the `event` resource, whose `data.object` is the service order as of the approval. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge - a non-2xx or a timeout is retried with backoff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/service-order-renewal-canceled
  service_order.renewal_cancel_denied:
    post:
      tags:
        - Webhooks
      operationId: onServiceOrderRenewalCancelDenied
      summary: A renewal cancellation was denied
      description: Sent when Clemta denies your cancellation request on a recurring order. The request is cleared and the order keeps renewing as before - contact support for the reasoning. The request body is the `event` resource, whose `data.object` is the service order as of the decision. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge - a non-2xx or a timeout is retried with backoff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/service-order-renewal-cancel-denied
  requirement.created:
    post:
      tags:
        - Webhooks
      operationId: onRequirementCreated
      summary: Something is needed from you or your client
      description: 'Sent when a requirement opens: an owner''s identity document, a service-order form, or something Clemta asked for (a company-name change, extra information). The request body is the `event` resource whose `data.object` is the requirement. Fulfill it over the API or hand your client a hosted link. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/requirement-created
  requirement.fulfilled:
    post:
      tags:
        - Webhooks
      operationId: onRequirementFulfilled
      summary: A requirement was fulfilled
      description: Sent when an open requirement resolves - by your API call or by your client through a hosted link. The request body is the `event` resource whose `data.object` is the requirement with its response. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/requirement-fulfilled
  requirement.canceled:
    post:
      tags:
        - Webhooks
      operationId: onRequirementCanceled
      summary: A requirement was canceled
      description: Sent when an open requirement closes WITHOUT being fulfilled - a signer declining a signature request, or Clemta withdrawing the ask. The request body is the `event` resource whose `data.object` is the requirement. Its `cancel_reason` says why, in words safe to show your client. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/requirement-canceled
  requirement.signature.viewed:
    post:
      tags:
        - Webhooks
      operationId: onRequirementSignatureViewed
      summary: A signer opened a signature document
      description: Sent the first time a signer opens the signature document. A requirement with several signers fires this once per signer. The request body is the `event` resource whose `data.object` is the requirement with its `signers`. Progress only - the document is not signed yet. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/requirement-signature-viewed
  requirement.signature.signed:
    post:
      tags:
        - Webhooks
      operationId: onRequirementSignatureSigned
      summary: A signer signed a signature document
      description: Sent when one signer completes their part of a signature document. A document with several signers fires this once per signer. The requirement itself resolves (requirement.fulfilled) only when the last of them signs. The request body is the `event` resource whose `data.object` is the requirement with its `signers`. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/requirement-signature-signed
  file.created:
    post:
      tags:
        - Webhooks
      operationId: onFileCreated
      summary: A document is ready for you
      description: Sent when Clemta publishes a document on one of your companies. The request body is the `event` resource whose `data.object` is the file. Download the bytes from the file's content endpoint. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/file-created
  calendar.reminder:
    post:
      tags:
        - Webhooks
      operationId: onCalendarReminder
      summary: A compliance deadline is approaching
      description: Sent ahead of a company's compliance calendar deadline, once per reminder point. No mail is sent to your client - relay the reminder under your own brand. `data.object` is the calendar event with `due_at` and the `remind_at` that fired. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/calendar-reminder
  invoice.finalized:
    post:
      tags:
        - Webhooks
      operationId: onInvoiceFinalized
      summary: A wholesale invoice was finalized
      description: Sent when your month-end wholesale invoice is raised. The request body is the `event` resource, whose `data.object` is the invoice. It is collected automatically from your payment method on file. Verify the `Clemta-Webhook-Signature` header before trusting the payload, and respond with any 2xx to acknowledge - a non-2xx or a timeout is retried with backoff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '200':
          description: Acknowledged. Any 2xx marks the delivery received and stops retries.
      x-mint:
        href: /api-reference/webhooks/invoice-finalized
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        Your API key, e.g. `Authorization: Bearer clmt_test_`. Live keys use the `clmt_live_` prefix.
  parameters:
    ClemtaVersion:
      name: Clemta-Version
      in: header
      required: false
      description: Date-based API version to run this request against.
      schema:
        type: string
        example: '2026-08-13'
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated fields to sort by, a minus prefix for descending (for example `-created_at`). Each endpoint's sortable fields are in its description; an unsupported one is rejected with a suggestion.
      schema:
        type: string
        example: '-created_at,name'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    After:
      name: after
      in: query
      required: false
      description: Use the page's `end_cursor` as the `after` value to fetch the next page. Cursors are opaque and only valid for the listing that minted them.
      schema:
        type: string
    Before:
      name: before
      in: query
      required: false
      description: Use the page's `start_cursor` as the `before` value to fetch the previous page. Cannot be combined with `after`.
      schema:
        type: string
    AccountId:
      name: accountID
      in: path
      required: true
      description: The account id.
      schema:
        type: string
        pattern: ^acct_[0-9A-Za-z]{22}$
    Status:
      name: status
      in: query
      required: false
      style: deepObject
      explode: true
      allowReserved: true
      description: 'Filter by status. A bare value is an exact match (`status=active`), operators go in brackets: `status[neq]=cancelled`, `status[in]=in_progress,active`.'
      schema:
        anyOf:
          - type: string
            title: Exact match
            enum:
              - requires_information
              - in_progress
              - active
              - cancelled
          - type: object
            title: Operators
            additionalProperties: false
            properties:
              eq:
                type: string
                enum:
                  - requires_information
                  - in_progress
                  - active
                  - cancelled
                description: Exact match (same as the bare form).
              neq:
                type: string
                enum:
                  - requires_information
                  - in_progress
                  - active
                  - cancelled
                description: Any status except this one.
              in:
                type: string
                description: Comma-separated list, matches any of them.
              nin:
                type: string
                description: Comma-separated list, matches none of them.
    AccountIdFilter:
      name: account_id
      in: query
      required: false
      style: deepObject
      explode: true
      allowReserved: true
      description: Filter by the account (the incorporator) that owns the company. A bare value is an exact match (`account_id=acct_...`). Operators go in brackets (`account_id[in]=acct_a,acct_b`). The `Clemta-Account` header resolves to this same filter and overrides any value sent here.
      schema:
        anyOf:
          - type: string
            title: Exact match
            pattern: ^acct_[0-9A-Za-z]{22}$
          - type: object
            title: Operators
            additionalProperties: false
            properties:
              eq:
                type: string
                description: Exact match (same as the bare form).
              in:
                type: string
                description: Comma-separated list, matches any of them.
              nin:
                type: string
                description: Comma-separated list, matches none of them.
    ExpandCompany:
      name: expand[]
      in: query
      required: false
      description: 'Relations to embed. Expandable: account, requirements (the open requirements behind `open_requirements`), service_orders (every order on the company, auto-attached mandatory products included).'
      schema:
        type: array
        items:
          type: string
          enum:
            - account
            - requirements
            - service_orders
    ClemtaAccount:
      name: Clemta-Account
      in: header
      required: false
      description: The account (the incorporator) to create the company under, when it already exists. Omit it and pass `account` in the body to create one at the same time. Set one or the other, never both.
      schema:
        type: string
        pattern: ^acct_[0-9A-Za-z]{22}$
        example: acct_0346sFPEvSkJvY8vt14NNw
    CompanyId:
      name: companyID
      in: path
      required: true
      description: ID of the company.
      schema:
        type: string
        pattern: ^cmp_[0-9A-Za-z]{22}$
      example: cmp_0346sFPEvSkJvY8vt14NNw
    ServiceOrderId:
      name: orderID
      in: path
      required: true
      description: ID of the service order.
      schema:
        type: string
        pattern: ^so_[0-9A-Za-z]{22}$
      example: so_0346sFPEvSkJvY8vt14NNw
    StatusTokenId:
      name: tokenID
      in: path
      required: true
      description: The status token's management id.
      schema:
        type: string
        pattern: ^stok_[0-9A-Za-z]{22}$
      example: stok_0346sFPEvSkJvY8vt14NNw
    EventTypeFilter:
      name: type
      in: query
      required: false
      style: deepObject
      explode: true
      allowReserved: true
      description: Filter by event type. A bare value is an exact match (`type=company.status.changed`). Operators go in brackets (`type[in]=company.created,company.incorporated`).
      schema:
        anyOf:
          - type: string
            title: Exact match
          - type: object
            title: Operators
            additionalProperties: false
            properties:
              eq:
                type: string
                description: Exact match (same as the bare form).
              in:
                type: string
                description: Comma-separated list, matches any of them.
              nin:
                type: string
                description: Comma-separated list, matches none of them.
    EventCompanyIdFilter:
      name: company_id
      in: query
      required: false
      style: deepObject
      explode: true
      allowReserved: true
      description: Filter to the events of one company. A bare value is an exact match (`company_id=cmp_...`). Operators go in brackets (`company_id[in]=cmp_a,cmp_b`).
      schema:
        anyOf:
          - type: string
            title: Exact match
            pattern: ^cmp_[0-9A-Za-z]{22}$
          - type: object
            title: Operators
            additionalProperties: false
            properties:
              eq:
                type: string
                description: Exact match (same as the bare form).
              in:
                type: string
                description: Comma-separated list, matches any of them.
              nin:
                type: string
                description: Comma-separated list, matches none of them.
    EventCreatedAtFilter:
      name: created_at
      in: query
      required: false
      style: deepObject
      explode: true
      allowReserved: true
      description: 'Filter by creation time (RFC 3339). A bare value is an exact match. Range operators go in brackets: `created_at[gte]=2026-09-01T00:00:00Z`, `created_at[lt]=...`. Combine a `gte` lower bound with cursor paging to sweep the stream from a known point - see the webhooks guide on reconciling by polling.'
      schema:
        anyOf:
          - type: string
            title: Exact match
            format: date-time
          - type: object
            title: Operators
            additionalProperties: false
            properties:
              gt:
                type: string
                format: date-time
                description: Strictly after this moment.
              gte:
                type: string
                format: date-time
                description: At or after this moment.
              lt:
                type: string
                format: date-time
                description: Strictly before this moment.
              lte:
                type: string
                format: date-time
                description: At or before this moment.
    TaxFilingId:
      name: filingID
      in: path
      required: true
      description: ID of the tax filing.
      schema:
        type: string
        pattern: ^txf_[0-9A-Za-z]{22}$
      example: txf_0346sFPEvSkJvY8vt14NNw
    FileId:
      name: fileID
      in: path
      required: true
      description: ID of the file.
      schema:
        type: string
        pattern: ^file_[0-9A-Za-z]{22}$
      example: file_0346sFPEvSkJvY8vt14NNw
    FileLinkId:
      name: linkID
      in: path
      required: true
      description: The file link's id.
      schema:
        type: string
        pattern: ^link_[0-9A-Za-z]{22}$
    RequirementId:
      name: requirementID
      in: path
      required: true
      description: ID of the requirement.
      schema:
        type: string
        pattern: ^rqmt_[0-9A-Za-z]{22}$
      example: rqmt_0346sFPEvSkJvY8vt14NNw
    FixedAssetId:
      name: fixedAssetID
      in: path
      required: true
      description: ID of the fixed asset.
      schema:
        type: string
        pattern: ^fxa_[0-9A-Za-z]{22}$
      example: fxa_0346sFPEvSkJvY8vt14NNw
    OfficerId:
      name: officerID
      in: path
      required: true
      description: ID of the officer.
      schema:
        type: string
        pattern: ^off_[0-9A-Za-z]{22}$
      example: off_0346sFPEvSkJvY8vt14NNw
    RequirementToken:
      name: token
      in: path
      required: true
      description: The hosted token from a document link.
      schema:
        type: string
        pattern: ^rql_[0-9a-f]{48}$
  headers:
    ClemtaVersion:
      description: The API version the request was executed against.
      schema:
        type: string
  schemas:
    Me:
      type: object
      required:
        - object
        - partner_id
        - livemode
        - key_last4
        - api_version
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - me
          description: Entity name. Identifies this object when it arrives without its URL - nested under an `expand[]`, inside an event payload, or in a webhook.
        partner_id:
          type: string
          description: Identifier of the partner this key belongs to.
        livemode:
          type: boolean
          description: False for `clmt_test_` keys.
        key_last4:
          type: string
          description: Last four characters of the presented key.
        api_version:
          type: string
          description: Effective API version for this request.
    Error:
      type: object
      description: 'Error response: a stable machine-readable `code`, human-readable `title`/`detail`, and for validation failures an `errors` array naming every violating field.'
      required:
        - type
        - title
        - status
        - code
      additionalProperties: false
      properties:
        type:
          type: string
          description: Link to the error reference entry for this code.
          example: https://docs.clemta.com/partner/errors#resource_already_exists
        title:
          type: string
          description: Short human summary of the error class.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code, also included in the body.
        code:
          type: string
          enum:
            - api_key_invalid
            - api_key_expired
            - insufficient_scope
            - ip_address_not_allowed
            - invalid_request
            - invalid_api_version
            - resource_missing
            - method_not_allowed
            - test_mode_only
            - resource_already_exists
            - idempotency_key_mismatch
            - idempotency_key_in_use
            - request_too_large
            - billing_account_inactive
            - entitlement_required
            - rate_limit
            - api_error
          description: Stable machine-readable code - branch on this, never on `detail`.
        detail:
          type: string
          description: Human-readable specifics of this occurrence, wording may change.
        request_id:
          type: string
          description: Identifier of this request. Quote it in a support request so we can trace the failure.
        errors:
          type: array
          description: 'Present on validation failures: one entry per violating field.'
          items:
            type: object
            required:
              - reason
            additionalProperties: false
            properties:
              reason:
                type: string
              location:
                type: string
                description: JSONPath of the failing field, e.g. `$.name`.
              validation_type:
                type: string
                description: Schema keyword that failed.
              how_to_fix:
                type: string
    Page:
      type: object
      description: Cursor-pagination block carried by every list response.
      required:
        - start_cursor
        - end_cursor
        - has_next_page
        - has_prev_page
        - limit
        - total
      properties:
        start_cursor:
          type:
            - string
            - 'null'
          description: Use as the `before` query parameter to load the previous page. `null` when the page is empty. Opaque, internal structure may change.
        end_cursor:
          type:
            - string
            - 'null'
          description: Use as the `after` query parameter to load the next page. `null` when the page is empty. Opaque, internal structure may change.
        has_next_page:
          type: boolean
          description: Whether a next page exists.
        has_prev_page:
          type: boolean
          description: Whether a previous page exists.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: The page size this response was built with.
        total:
          type: integer
          minimum: 0
          description: Count of items across all pages of the filtered listing.
    Account:
      type: object
      required:
        - object
        - id
        - livemode
        - first_name
        - last_name
        - email
        - created_at
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - account
          description: Entity name. Identifies this object when it arrives without its URL.
        id:
          type: string
          pattern: ^acct_[0-9A-Za-z]{22}$
          description: Identifier of the account.
          example: acct_0346sFPEvSkJvY8vt14NNw
        external_id:
          type: string
          description: Your own identifier for this account, unique across your accounts.
        livemode:
          type: boolean
          description: Whether this account was created with a live key.
        first_name:
          type: string
          description: The customer's first name.
        last_name:
          type: string
          description: The customer's last name.
        email:
          type: string
          format: email
          description: The customer's email. Stored as contact data only - the customer never receives any message from Clemta.
        phone:
          type: string
          description: The customer's phone number, optional, stored as contact data.
        metadata:
          type: object
          additionalProperties: true
          description: Your own key-value pairs, stored and returned verbatim. Clemta never reads them. Use them to correlate the account with your system.
        created_at:
          type: string
          format: date-time
    AccountList:
      type: object
      required:
        - object
        - page
        - items
      properties:
        object:
          type: string
          enum:
            - list
          description: Entity name.
        page:
          $ref: '#/components/schemas/Page'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    CreateAccountBody:
      type: object
      required:
        - first_name
        - last_name
        - email
      additionalProperties: false
      properties:
        external_id:
          type: string
          minLength: 1
          maxLength: 255
          description: Your own identifier for this account. Must be unique across your accounts. Reusing one is rejected. Use `Idempotency-Key` to retry safely.
        first_name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^\r\n\t]+$
          description: The customer's first name.
        last_name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^\r\n\t]+$
          description: The customer's last name.
        email:
          type: string
          format: email
          maxLength: 254
          description: The customer's email, stored as contact data only.
        phone:
          type: string
          minLength: 7
          maxLength: 20
          pattern: ^[0-9+()\s.-]+$
          description: The customer's phone number, optional. Digits with optional `+`, spaces, and `()`.-` separators.
        metadata:
          type: object
          additionalProperties: true
          description: Your own key-value pairs, stored and returned verbatim.
