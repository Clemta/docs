openapi: 3.1.0
info:
  title: Clemta Partner API
  description: |
    The Clemta partner surface. Authenticate with your API key as a bearer
    token (`Authorization: Bearer clmt_live_` or `clmt_test_`). Keys with
    the `clmt_test_` prefix operate in sandbox mode (`livemode: false`): test
    data never reaches fulfillment or billing.

    Versioning is date-based: pass `Clemta-Version` to pin a
    version, omit it to run on your account's pinned default. The effective
    version is echoed back on every response.
  version: '2026-08-13'
servers:
  - url: https://api.clemta.com/v1
    description: |
      Single host for both modes: `clmt_test_` keys operate in sandbox mode, `clmt_live_` keys in live mode.
security:
  - apiKey: []
tags:
  - name: Identity
    description: Identify the calling API key.
  - name: Accounts
    description: Create and read customer accounts - the incorporators companies are created under.
  - name: Companies
    description: Create and read client companies.
  - name: Service orders
    description: Order services against a company and follow their fulfilment.
  - name: Products
    description: The catalog you can offer, at your wholesale prices.
  - name: Tax filings
    description: Federal and state tax filings on your companies, opened by your client against the company's entitlements and worked by Clemta. Read-only. Follow them with the tax_filing.* events.
  - name: Files
    description: Documents Clemta publishes on your companies - formation deliverables, filed forms, letters. Read-only. Client KYC uploads are write-only and never listed.
  - name: Requirements
    description: Everything needed from you or your client - identity documents, service-order forms, Clemta's asks - as one resolvable resource. Fulfill over the API or hand your client a hosted link.
  - name: Status tracking
    description: End-customer status links - keyless, read-only access to a company's live status.
  - name: Events
    description: Poll the partner event stream.
  - name: Webhooks
    description: |-
      Events we deliver to your endpoint, and how to verify them. Each webhook below is a request WE send to you. Respond 2xx to acknowledge. Deliveries are signed and retried with exponential backoff over multiple days until acknowledged. Answer `410 Gone` to have the endpoint disabled and deliveries stopped. A `Retry-After` header on a `429` or `503` pushes the next attempt back. An endpoint that fails continuously for days is disabled automatically and the workspace owner is emailed - no events are lost, the stream stays available on `GET /v1/events`.

      ## Verifying a delivery

      Deliveries are signed per the [Standard Webhooks](https://www.standardwebhooks.com) specification, carrying BOTH schemes in one header: a symmetric `v1` HMAC (verify with your endpoint secret and any standardwebhooks library) and an asymmetric `v1a` ed25519 signature (verify with the endpoint's public key, no shared secret held). Use whichever suits your setup.

      Every endpoint has its OWN signing secret (`whsec_...`), shown once when you create the endpoint. Each delivery carries three headers:

      - `Clemta-Webhook-Id` - the event id. Stable across retries: use it as an idempotency key so a redelivered event is processed once.
      - `Clemta-Webhook-Timestamp` - unix seconds of THIS attempt (a retry carries a fresh one).
      - `Clemta-Webhook-Signature` - a space-delimited list of `v1,<base64>` signatures. More than one while a secret rotation's overlap window is open, one per active secret.

      Each is also sent under its bare Standard Webhooks name (`webhook-id`, `webhook-timestamp`, `webhook-signature`) with the same value, which is what off-the-shelf standardwebhooks libraries look up.

      To verify by hand:

      1. Build the signed content by joining the id, the timestamp, and the raw request body with literal `.` separators: `{id}.{timestamp}.{body}`. Use the body exactly as received - do not re-serialize the JSON.
      2. Base64-decode your endpoint secret after the `whsec_` prefix. That is the HMAC key.
      3. Compute HMAC-SHA256 over the signed content, base64 encode it, and compare it against each `v1,` entry in constant time. Accept if any matches, otherwise reject.
      4. Check the timestamp is within 5 minutes of now, to reject replays.

      Because the secret is unique to your endpoint, a signature can only be verified by you - a delivery meant for another endpoint cannot be made to verify here. Keep the secret confidential. If it leaks, roll the endpoint's secret from the Webhooks page of your partner dashboard.
  - name: Sandbox
    description: Test-key-only endpoints for rehearsing event flows. Trigger a lifecycle transition on a test company and receive the matching webhook, without waiting for a real formation to progress.
paths:
  /me:
    get:
      tags:
        - Identity
      operationId: getMe
      summary: Identify the calling API key
      description: Returns the partner and mode the presented key resolves to.
      parameters:
        - $ref: '#/components/parameters/ClemtaVersion'
      responses:
        '200':
          description: The caller's identity.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/get-me
  /accounts:
    post:
      tags:
        - Accounts
      operationId: createAccount
      summary: Create an account for a customer
      description: Creates an account - one of your end customers - that companies are then created under. The customer receives no messages from Clemta. Pass `Idempotency-Key` to make retries safe.
      parameters:
        - $ref: '#/components/parameters/ClemtaVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountBody'
      responses:
        '201':
          description: The created account.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/create-account
    get:
      tags:
        - Accounts
      operationId: listAccounts
      summary: List your accounts - sortable, cursor-paged
      parameters:
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: One page of accounts, newest first by default.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: Your accounts, newest first. Sortable by `created_at`.
      x-mint:
        href: /api-reference/list-accounts
  /accounts/{accountID}:
    get:
      tags:
        - Accounts
      operationId: getAccount
      summary: Fetch an account
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ClemtaVersion'
      responses:
        '200':
          description: The account.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/get-account
    post:
      tags:
        - Accounts
      operationId: updateAccount
      summary: Update an account's metadata
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/ClemtaVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountBody'
      responses:
        '200':
          description: The updated account.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/update-account
  /companies:
    post:
      tags:
        - Companies
      operationId: createCompany
      summary: Create a client company
      description: Creates a client user and a company shell attributed to you. The client receives no messages from Clemta. Pass `Idempotency-Key` to make retries safe.
      parameters:
        - $ref: '#/components/parameters/ClemtaVersion'
        - $ref: '#/components/parameters/ClemtaAccount'
        - $ref: '#/components/parameters/ExpandCompany'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyBody'
      responses:
        '201':
          description: The created company.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/create-company
    get:
      tags:
        - Companies
      operationId: listCompanies
      summary: List your companies - filterable, sortable, cursor-paged
      parameters:
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/AccountIdFilter'
        - $ref: '#/components/parameters/ExpandCompany'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: One page of companies, newest first by default.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: Sort by `created_at` or `name`. Filter by any company field, `external_id` and `state` included.
      x-mint:
        href: /api-reference/list-companies
  /companies/{companyID}:
    get:
      tags:
        - Companies
      operationId: getCompany
      summary: Retrieve a company
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/ClemtaVersion'
        - $ref: '#/components/parameters/ExpandCompany'
      responses:
        '200':
          description: The company.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/get-company
    post:
      tags:
        - Companies
      operationId: updateCompany
      summary: Update a company
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/ClemtaVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyBody'
      responses:
        '200':
          description: The updated company.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/update-company
  /companies/{companyID}/service-orders:
    post:
      tags:
        - Service orders
      operationId: createServiceOrder
      summary: Attach a service to a company
      description: Orders a product against the company and bills you for it at creation, at your wholesale price. Idempotent - re-attaching the same product returns the existing order and does not bill you twice. Pass `Idempotency-Key` for safe retries.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/ClemtaVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceOrderBody'
      responses:
        '201':
          description: The service order.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/create-service-order
    get:
      tags:
        - Service orders
      operationId: listServiceOrders
      summary: List a company's service orders
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/ClemtaVersion'
      responses:
        '200':
          description: The company's service orders, newest first.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/list-service-orders
  /companies/{companyID}/service-orders/{orderID}:
    get:
      tags:
        - Service orders
      operationId: getServiceOrder
      summary: Retrieve a service order
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/ServiceOrderId'
        - $ref: '#/components/parameters/ClemtaVersion'
      responses:
        '200':
          description: The service order.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/get-service-order
    post:
      tags:
        - Service orders
      operationId: updateServiceOrder
      summary: Upgrade a service order's options
      description: Changes an in-flight order's variant choices and bills you the price DIFFERENCE - for example moving an `ein` order's `processing` from `standard` to `expedited` after the fact. Only upgrades are accepted (the new choice must not price below the current one), the order must not be completed or canceled, and the product's `available_when` must still hold for the company as it stands now - an ein upgrade is refused once the company's EIN is recorded. One upgrade may stand at a time. Choices that add a companion service attach it automatically.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/ServiceOrderId'
        - $ref: '#/components/parameters/ClemtaVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceOrderBody'
      responses:
        '200':
          description: The upgraded service order, at its new price.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/update-service-order
    delete:
      tags:
        - Service orders
      operationId: cancelServiceOrder
      summary: Cancel a service order
      description: 'Cancels an order still in `received` and credits back what you were billed. An order already in fulfilment cannot be reversed, but an ACTIVE RECURRING one takes a cancellation REQUEST instead: the call stamps `renewal_cancel_requested_at` and Clemta decides. Renewals keep billing until the request is approved. On approval the service runs to the end of the current period (`renewal_ends_at`) and is not billed again - except a product billed in arrears, whose running period still bills at its end, since it was served. You hear the outcome as `service_order.renewal_canceled` or `service_order.renewal_cancel_denied`. Fulfilment status is untouched. Cancelling again while a request is pending or decided is a no-op. A one-time order in fulfilment is refused with 409.'
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/ServiceOrderId'
        - $ref: '#/components/parameters/ClemtaVersion'
      responses:
        '200':
          description: The cancelled service order.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/cancel-service-order
  /products:
    get:
      tags:
        - Products
      operationId: listProducts
      summary: List the products you can offer, at your prices
      description: Your catalog with your wholesale price on each line - your override where you have one, the default otherwise. These keys are what you pass as `product_key` when you attach a service order.
      parameters:
        - $ref: '#/components/parameters/ClemtaVersion'
      responses:
        '200':
          description: Your catalog.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/list-products
  /products/{productKey}/price-preview:
    get:
      tags:
        - Products
      operationId: previewProductPrice
      summary: Preview every line an order would bill
      description: 'Resolve one product for a company profile BEFORE creating anything: your own amount (override, matching price rule, or default - `applied_rule` says which), each option value''s effective amount, and every pass-through government or state fee line at today''s amounts. Use it to price your own offer with no surprises. The order itself resolves again and freezes what it billed on the order''s `fees`. Formation keys also carry the state''s filing fee.'
      parameters:
        - name: productKey
          in: path
          required: true
          schema:
            type: string
          example: annual_state_filing
        - name: entity_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - llc
              - c_corp
        - name: state
          in: query
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z]{2}$
          description: The company's formation state, as a 2-letter code.
          example: DE
        - name: pre_existing
          in: query
          required: false
          schema:
            type: boolean
          description: Preview for a pre-existing company you bring in. Defaults to false.
        - name: owners_count
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: How many owners the company has. Defaults to 1.
        - name: has_ein
          in: query
          required: false
          schema:
            type: boolean
          description: Whether the company already holds an EIN. A price rule may condition on it, so state it to preview the same amount the order resolves. Defaults to false (a fresh formation).
        - name: incorporated
          in: query
          required: false
          schema:
            type: boolean
          description: Whether the company is already incorporated (holds a formation date). A price rule may condition on it. Defaults to false.
      responses:
        '200':
          description: The resolved preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        href: /api-reference/preview-product-price
  /companies/price-preview:
    post:
      tags:
        - Companies
      operationId: previewCompanyBasket
      summary: Preview what creating a company would bill
      description: Resolve the whole basket a company create would charge - the formation with its state filing fee, every mandatory service the profile auto-attaches, and every service you list - WITHOUT creating anything. Priced by the same resolution the create runs, so it cannot quote a total the create does not charge. Each line carries its own interval, and the lines are not summed. Amounts are estimates - the create resolves again and freezes what it billed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyPricePreviewBody'
      responses:
        '200':
          description: The resolved basket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPricePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-mint:
        href: /api-reference/preview-company-basket
  /companies/{companyID}/products/{productKey}/price-preview:
    get:
      tags:
        - Products
      operationId: previewCompanyProductPrice
      summary: Preview a product's price for an existing company
      description: Resolve what a product would bill for THIS company, read from the company's own attributes - no profile query params to state or get wrong. It resolves against the same facts the order does (entity type, state, owner count, whether it holds an EIN, whether it is incorporated), so it cannot quote a price the order would not charge. Returns your own amount (override, matching price rule, or default - `applied_rule` says which), each option value's effective amount, and every pass-through government or state fee line at today's amounts. Use `GET /products/{productKey}/price-preview` instead to price a product for a hypothetical company before one exists.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - name: productKey
          in: path
          required: true
          schema:
            type: string
          example: annual_state_filing
      responses:
        '200':
          description: The resolved preview for this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricePreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-mint:
        href: /api-reference/preview-company-product-price
  /companies/{companyID}/status-tokens:
    post:
      tags:
        - Status tracking
      operationId: createStatusToken
      summary: Create an end-customer status link
      description: Mints a read-only status link for the company and returns its URL. Hand the URL to your client. Anyone holding it can read the company's live status - progress only, no documents, no personal data, no prices - by calling GET /status/{token}, so you can drive a progress view in your own product without sharing your API key. Multiple links per company are allowed, each individually revocable. The URL is shown once.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/ClemtaVersion'
      responses:
        '201':
          description: The status link, with its URL shown once.
          headers:
            Clemta-Version:
              $ref: '#/components/headers/ClemtaVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-mint:
        href: /api-reference/create-status-token
    get:
      tags:
        - Status tracking
      operationId: listStatusTokens
      summary: List a company's status links
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/ClemtaVersion'
      responses:
        '200':
          description: The company's status links. The URLs are not returned again.
          headers:
            Clemta-Version:
